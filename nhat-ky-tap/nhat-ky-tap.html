<title>Nhật Ký Tập Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: phone-first single column. Bottom tab bar (Tập · Nhật ký · Tiến bộ · Thư viện); the live workout takes the whole screen
   with a rest-timer dock. Display face is a condensed sports numeral face (scoreboard feel); body face is built for Vietnamese. */
/* Palette: đỏ mận (chính) · xanh lục (trạng thái tốt) · vàng hoa cúc (điểm nhấn) — phối theo màu ngân hàng nông nghiệp, không dùng logo/tên. */
:root {
  --bg: #F5F1F2;
  --surface: #FFFFFF;
  --surface-2: #ECE4E6;
  --ink: #26161B;
  --muted: #6E5A60;
  --line: #E2D6D9;
  --accent: #A8203E;
  --accent-ink: #FFFFFF;
  --accent-soft: #F7E1E6;
  --good: #11704A;
  --good-bg: #DCEFE5;
  --info: #1C6B70;
  --info-bg: #DDEDEE;
  --warn: #855600;
  --warn-bg: #FCEFCC;
  --danger: #B42F2A;
  --danger-bg: #FAE1DF;
  --gold: #E9AA1F;
  --gold-ink: #2B1C00;
  --hero-bg: #7D1530;
  --hero-ink: #FFFFFF;
  --body: #E7DDE0;
  --muscle-off: #D6C7CC;
  --scrim: rgba(30, 10, 16, .5);
  --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 16px;
  --tab-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150D10; --surface: #211519; --surface-2: #2E1F24; --ink: #F4EAED; --muted: #B6A0A7; --line: #3E2B31;
    --accent: #E35A77; --accent-ink: #2A0710; --accent-soft: #46202A;
    --good: #4FCB94; --good-bg: #133126; --info: #6CC3C8; --info-bg: #12302F; --warn: #EDBB4E; --warn-bg: #3A2C10;
    --danger: #FF8A80; --danger-bg: #3F1D1B; --gold: #EDB43A; --gold-ink: #2B1C00; --hero-bg: #5A1023; --hero-ink: #FFFFFF;
    --body: #33252A; --muscle-off: #4A363C; --scrim: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150D10; --surface: #211519; --surface-2: #2E1F24; --ink: #F4EAED; --muted: #B6A0A7; --line: #3E2B31;
  --accent: #E35A77; --accent-ink: #2A0710; --accent-soft: #46202A;
  --good: #4FCB94; --good-bg: #133126; --info: #6CC3C8; --info-bg: #12302F; --warn: #EDBB4E; --warn-bg: #3A2C10;
  --danger: #FF8A80; --danger-bg: #3F1D1B; --gold: #EDB43A; --gold-ink: #2B1C00; --hero-bg: #5A1023; --hero-ink: #FFFFFF;
  --body: #33252A; --muscle-off: #4A363C; --scrim: rgba(0, 0, 0, .62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; min-height: 62px; }
.top-text { flex: 1; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; text-wrap: balance; overflow-wrap: anywhere; }
h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; }
h3 { margin: 0; font-size: 16px; font-weight: 600; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }

main { padding-block: 6px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 24px; }
main.workout { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
section { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; text-align: left; width: 100%; }
button.card { cursor: pointer; }
.card-title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.info { background: var(--info-bg); color: var(--info); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; background: var(--surface); }
.empty p { margin: 0; color: var(--muted); }

/* Hero: next session */
.hero { background: var(--hero-bg); color: var(--hero-ink); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; border-bottom: 4px solid var(--gold); }
.hero .eyebrow { color: rgba(255, 255, 255, .72); }
.hero .big { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; }
.hero ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.hero .btn.primary { align-self: stretch; background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.hero .btn.ghost { color: var(--hero-ink) !important; border-color: rgba(255, 255, 255, .35) !important; }
.hero .meta { font-size: 13px; color: rgba(255, 255, 255, .75); }
.top { border-bottom: 3px solid var(--gold); }
.avatar { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; font-size: 20px; display: grid; place-items: center; flex: none; }
.me-card { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--good); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
.progress { height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--good); }
.banner-backup { background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.banner-backup b { color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card.routine { gap: 4px; border-left: 5px solid var(--gold); }
.card.routine.cooldown { border-left-color: var(--good); }
.goal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.goal-grid button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; text-align: left; padding: 8px 12px; }
.goal-grid button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bmi { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
svg.body { display: block; width: 100%; max-width: 260px; height: auto; margin: 0 auto; }
svg.body text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); font-weight: 600; }
.lib-row { display: flex; gap: 12px; align-items: center; }
.lib-row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.lib-row svg.body { width: 76px; flex: none; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 4px; vertical-align: middle; }
.legend .dot.s { opacity: .4; }
.help ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.help h2 { font-size: 18px; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.week .d { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.week .d b { font-family: var(--font-display); font-size: 20px; color: var(--ink); line-height: 1.1; }
.week .d.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.week .d.on b { color: var(--accent-ink); }
.week .d.today { outline: 2px solid var(--ink); outline-offset: -2px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--muted); line-height: 1.3; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 38px; font-size: 14px; font-weight: 600; color: var(--muted); padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips-scroll button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chips-scroll button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Workout */
.ex-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.ex-card.complete { border-color: var(--good); }
.ex-head { display: flex; align-items: flex-start; gap: 10px; }
.ex-head .t { flex: 1; min-width: 0; }
.ex-name { background: none; border: 0; padding: 0; text-align: left; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.hint { font-size: 13px; border-radius: 10px; padding: 8px 10px; background: var(--info-bg); color: var(--info); }
.hint.pt { background: var(--warn-bg); color: var(--warn); }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 6px; align-items: center; }
.set.one { grid-template-columns: 34px minmax(0, 1fr) 48px; }
.set-head { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.set .idx { font-family: var(--font-display); font-size: 20px; text-align: center; color: var(--muted); }
.set input { width: 100%; min-width: 0; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); text-align: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.set input::placeholder { color: var(--muted); font-weight: 500; opacity: .7; }
.check { width: 48px; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; }
.check svg { width: 22px; height: 22px; opacity: .35; }
.set.done input { background: var(--good-bg); border-color: transparent; }
.set.done .check { background: var(--good); border-color: var(--good); color: var(--surface); }
.set.done .check svg { opacity: 1; }
.ex-foot { display: flex; gap: 8px; flex-wrap: wrap; }
.note-in { width: 100%; min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 8px 12px; font-size: 14px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.rest { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.rest .time { font-family: var(--font-display); font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.rest .bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.rest .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
.paused { background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.paused b { color: var(--ink); font-size: 16px; }
main.workout.is-paused .ex-card { opacity: .55; }
#elapsed.paused-clock { color: var(--warn); }
.rest.idle .time { color: var(--muted); font-size: 18px; font-family: var(--font-body); font-weight: 600; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); }
.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tabbar svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* Sheets */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet.top-layer { z-index: 25; }
.sheet-scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet-panel { position: relative; background: var(--bg); border-radius: 20px 20px 0 0; max-height: calc(100% - 20px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 640px; margin: 0 auto; }
.sheet-panel .wrap { padding-block: 6px; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; background: var(--bg); padding-block: 6px; z-index: 1; }
.sheet-head h2 { text-transform: none; font-size: 24px; letter-spacing: .01em; overflow-wrap: anywhere; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); min-width: 0; }
.f input, .f select, .f textarea, .search { width: 100%; min-width: 0; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; font-size: 16px; color: var(--ink); }
.f textarea { min-height: 96px; resize: vertical; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale button { min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; padding: 4px 2px; }
.scale button b { font-family: var(--font-display); font-size: 20px; }
.scale button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.pick { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; text-align: left; width: 100%; }
.pick .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.pick[aria-pressed="true"] { border-color: var(--accent); }
.pick[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick .grow { flex: 1; min-width: 0; }
.plan-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.plan-item .mini { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
.plan-item .mini input, .plan-item .cue { width: 100%; min-height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); padding: 6px 10px; font-size: 16px; }
.plan-item .mini input { text-align: center; font-variant-numeric: tabular-nums; }
.rm { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 18px; flex: none; }
.confirm { background: var(--danger-bg); color: var(--danger); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.t th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
table.t .r { text-align: right; font-variant-numeric: tabular-nums; }
.day-label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
details.tips { border-radius: 10px; background: var(--good-bg); color: var(--good); font-size: 13.5px; }
details.tips summary { list-style: none; cursor: pointer; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
details.tips summary::-webkit-details-marker { display: none; }
details.tips summary::after { content: "Xem thêm"; margin-left: auto; flex: none; font-weight: 600; font-size: 12px; opacity: .8; text-decoration: underline; }
details.tips[open] summary::after { content: "Thu gọn"; }
details.tips .in { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
details.tips ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.tip-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--good); }
.tip-day { background: var(--good-bg); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.tip-day .tip-label { color: var(--good); }
.tip-day p { margin: 0; font-size: 15px; }
.cue-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.cue-list li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.guide-sec { display: flex; flex-direction: column; gap: 8px; }
.guide-sec ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.ex-link { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* Ăn uống */
details.older { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
details.older summary { color: var(--accent); }

details.wgroup { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: var(--radius); }

details.wgroup summary::after { content: "Mở"; font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: underline; }

.wg-in { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 10px; }
.food-add { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.food-add .btn.primary { grid-column: 1 / -1; min-height: 54px; font-size: 16px; }
.nutri .progress { height: 10px; }
.progress i.good { background: var(--good); }

.progress i.over { background: var(--warn); }
.meal { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; text-align: left; width: 100%; }
.meal img, .meal .ph { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); display: grid; place-items: center; font-size: 28px; }
.meal .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.meal .fb, .fb { font-size: 13px; background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 4px 8px; }
.meal-big { width: 100%; max-height: 46vh; object-fit: cover; border-radius: 14px; display: block; background: var(--surface-2); }
.portion { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.portion .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.portion .pv { width: 36px; text-align: center; font-family: var(--font-display); font-size: 22px; }
.portion .btn.sm { width: 40px; padding: 0; font-size: 20px; }
.ai-btn { background: var(--info-bg); color: var(--info); border-color: transparent; }
.card.ai { border-color: var(--info); }
.ai-items { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.ai-items li { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
/* Ảnh/video gửi HLV */
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mtile { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.mtile img, .mtile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.mtile .mstate { position: absolute; left: 4px; bottom: 4px; font-size: 10.5px; font-weight: 600; background: rgba(0,0,0,.6); color: #fff; padding: 1px 6px; border-radius: 6px; pointer-events: none; }
.mtile .mx { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 1; }
.media-box { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
/* Chuyển cảnh mượt */
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
main.enter > * { animation: viewIn .26s cubic-bezier(.2, .8, .2, 1) both; }
main.enter > *:nth-child(2) { animation-delay: .03s; } main.enter > *:nth-child(3) { animation-delay: .06s; } main.enter > *:nth-child(n+4) { animation-delay: .09s; }
.sheet:not([hidden]) .sheet-panel { animation: sheetUp .28s cubic-bezier(.2, .8, .2, 1) both; }
.sheet:not([hidden]) .sheet-scrim { animation: fadeIn .2s ease both; }
.toast:not([hidden]) { animation: fadeIn .18s ease both; }
.btn, .card, .meal, .pick, .tabbar button, .icon-btn, .me-card { transition: transform .12s ease, background-color .15s ease; }
.btn:active, button.card:active, .meal:active, .pick:active, .tabbar button:active, .icon-btn:active, .me-card:active { transform: scale(.97); }
.tabbar button svg { transition: transform .2s ease; }
.tabbar button[aria-current="page"] svg { transform: translateY(-2px); }

      mistakes: ['Mất thăng bằng do bước theo một đường thẳng — mở hai chân như hai đường ray.'] },
    { id: 'wall-sit', name: 'Ngồi dựa tường', group: 'legs', equip: 'Tường', type: 'time', inc: 0,
      steps: ['Lưng áp tường, trượt xuống đến khi đùi song song sàn.', 'Gối ngay trên cổ chân.', 'Giữ, thở đều.'],
      mistakes: ['Đặt tay lên đùi để đỡ.'] },
    { id: 'pushup', name: 'Chống đẩy', group: 'chest', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Tay rộng hơn vai một chút, người thẳng từ đầu đến gót.', 'Hạ ngực gần sàn, khuỷu tay khoảng 45° so với thân.', 'Đẩy lên, siết bụng.'],
      mistakes: ['Võng hông.', 'Khuỷu tay bè ngang 90°.'] },
    { id: 'knee-pushup', name: 'Chống đẩy gối', group: 'chest', equip: 'Thảm', type: 'reps', inc: 0,
      steps: ['Quỳ gối, tay rộng hơn vai, thân thẳng từ đầu đến gối.', 'Hạ ngực xuống gần sàn.', 'Đẩy lên. Khi làm được 3×15, chuyển sang chống đẩy thường.'],
      mistakes: ['Chổng mông.'] },
    { id: 'db-bench', name: 'Đẩy ngực tạ đơn', group: 'chest', equip: 'Tạ đơn + ghế', type: 'weight', inc: 1,
      steps: ['Nằm ghế, bàn chân chạm sàn, bả vai khép về sau.', 'Hạ tạ ngang ngực, khuỷu khoảng 45°.', 'Đẩy tạ lên trên ngực, thở ra.'],
      mistakes: ['Nhấc mông khỏi ghế.', 'Hạ tạ quá nhanh.'] },
    { id: 'bench', name: 'Đẩy ngực thanh đòn', group: 'chest', equip: 'Thanh đòn + ghế', type: 'weight', inc: 2.5,
      steps: ['Mắt dưới thanh đòn, bả vai khép, chân vững.', 'Hạ thanh đòn chạm nhẹ giữa ngực.', 'Đẩy lên theo đường hơi cong về phía mặt.'],
      mistakes: ['Nảy thanh đòn trên ngực.', 'Tập nặng không có người hỗ trợ.'] },
    { id: 'chest-press', name: 'Đẩy ngực máy', group: 'chest', equip: 'Máy', type: 'weight', inc: 2.5,
      steps: ['Chỉnh ghế để tay cầm ngang giữa ngực.', 'Đẩy ra đến gần thẳng tay.', 'Về chậm, cảm nhận ngực căng.'],
      mistakes: ['Nhún vai lên tai.'] },
    { id: 'incline-db', name: 'Đẩy ngực dốc lên tạ đơn', group: 'chest', equip: 'Tạ đơn + ghế dốc', type: 'weight', inc: 1,
      steps: ['Ghế dốc 30°, bả vai khép.', 'Hạ tạ ngang ngực trên.', 'Đẩy lên, hai tạ gần nhau ở trên.'],
      mistakes: ['Ghế dốc quá cao thành bài vai.'] },
    { id: 'lat-pulldown', name: 'Kéo xô (Lat Pulldown)', group: 'back', equip: 'Máy cáp', type: 'weight', inc: 2.5,
      steps: ['Nắm thanh rộng hơn vai, ngực hướng lên.', 'Kéo thanh xuống ngực trên, khuỷu tay hướng xuống sàn.', 'Thả lên chậm đến khi tay gần thẳng.'],
      mistakes: ['Ngả người ra sau quá nhiều.', 'Kéo bằng tay thay vì lưng.'] },
    { id: 'cable-row', name: 'Kéo cáp ngồi (Seated Row)', group: 'back', equip: 'Máy cáp', type: 'weight', inc: 2.5,
      steps: ['Ngồi thẳng, gối hơi chùng.', 'Kéo tay cầm về bụng, khép hai bả vai.', 'Duỗi tay về trước có kiểm soát.'],
      mistakes: ['Đung đưa thân để kéo.'] },
    { id: 'db-row', name: 'Chèo tạ đơn 1 tay', group: 'back', equip: 'Tạ đơn + ghế', type: 'weight', inc: 1,
      steps: ['Một tay và gối tựa ghế, lưng song song sàn.', 'Kéo tạ về hông, khuỷu sát người.', 'Hạ chậm. Ghi số lần mỗi tay.'],
      mistakes: ['Xoay thân để kéo.'] },
    { id: 'assisted-pullup', name: 'Hít xà có trợ lực', group: 'back', equip: 'Máy trợ lực / dây kháng lực', type: 'reps', inc: 0,
      steps: ['Nắm xà rộng hơn vai, có trợ lực đỡ.', 'Kéo người lên đến cằm qua xà.', 'Hạ chậm đến thẳng tay.'],
      mistakes: ['Đánh đu lấy đà.'] },
    { id: 'superman', name: 'Superman', group: 'back', equip: 'Thảm', type: 'reps', inc: 0,
      steps: ['Nằm sấp, tay duỗi qua đầu.', 'Nhấc tay, ngực và chân lên cùng lúc, giữ 2 giây.', 'Hạ chậm.'],
      mistakes: ['Ngửa cổ quá mức.'] },
    { id: 'db-press', name: 'Đẩy vai tạ đơn', group: 'shoulders', equip: 'Tạ đơn', type: 'weight', inc: 1,
      steps: ['Ngồi lưng thẳng, tạ ngang tai.', 'Đẩy tạ lên trên đầu.', 'Hạ về ngang tai.'],
      mistakes: ['Ưỡn lưng dưới.'] },
    { id: 'lateral-raise', name: 'Dang tạ sang ngang', group: 'shoulders', equip: 'Tạ đơn nhẹ', type: 'weight', inc: 1,
      steps: ['Đứng thẳng, tạ hai bên, khuỷu hơi chùng.', 'Dang tay sang ngang đến ngang vai.', 'Hạ chậm 2–3 giây.'],
      mistakes: ['Nhún vai, dùng tạ quá nặng.'] },
    { id: 'face-pull', name: 'Face Pull', group: 'shoulders', equip: 'Máy cáp + dây', type: 'weight', inc: 2.5,
      steps: ['Ròng rọc ngang mặt, nắm dây hai tay.', 'Kéo dây về mặt, tách hai tay ra hai bên tai.', 'Về chậm.'],
      mistakes: ['Kéo xuống ngực thay vì ngang mặt.'] },
    { id: 'pike-pushup', name: 'Pike Push-up', group: 'shoulders', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Chống tay, đẩy hông lên cao tạo hình chữ V ngược.', 'Gập khuỷu hạ đầu về phía sàn.', 'Đẩy lên.'],
      mistakes: ['Hông hạ thấp thành chống đẩy thường.'] },
    { id: 'db-curl', name: 'Cuốn tạ đơn (tay trước)', group: 'arms', equip: 'Tạ đơn', type: 'weight', inc: 1,
      steps: ['Đứng thẳng, khuỷu sát hông.', 'Cuốn tạ lên vai, xoay lòng bàn tay lên.', 'Hạ chậm đến gần thẳng tay.'],
      mistakes: ['Đung đưa thân lấy đà.'] },
    { id: 'triceps-pushdown', name: 'Ép tay sau với cáp', group: 'arms', equip: 'Máy cáp', type: 'weight', inc: 2.5,
      steps: ['Khuỷu sát hông, nắm thanh/dây.', 'Duỗi thẳng tay xuống, siết tay sau.', 'Về chậm đến khuỷu khoảng 90°.'],
      mistakes: ['Khuỷu tay di chuyển ra trước.'] },
    { id: 'plank', name: 'Plank', group: 'core', equip: 'Thảm', type: 'time', inc: 0,
      steps: ['Chống khuỷu tay ngay dưới vai.', 'Người thẳng từ đầu đến gót, siết bụng và mông.', 'Thở đều, giữ đến hết thời gian.'],
      mistakes: ['Võng hông hoặc chổng mông.'] },
    { id: 'side-plank', name: 'Plank nghiêng', group: 'core', equip: 'Thảm', type: 'time', inc: 0,
      steps: ['Nằm nghiêng, khuỷu dưới vai.', 'Nâng hông lên thành đường thẳng.', 'Giữ, rồi đổi bên. Ghi thời gian mỗi bên.'],
      mistakes: ['Hông chùng xuống.'] },
    { id: 'dead-bug', name: 'Dead Bug', group: 'core', equip: 'Thảm', type: 'reps', inc: 0,
      steps: ['Nằm ngửa, tay hướng trần, gối co 90°.', 'Ép lưng dưới xuống sàn, duỗi tay và chân đối diện.', 'Về giữa rồi đổi bên.'],
      mistakes: ['Lưng dưới nhấc khỏi sàn.'] },
    { id: 'bird-dog', name: 'Bird Dog', group: 'core', equip: 'Thảm', type: 'reps', inc: 0,
      steps: ['Quỳ bốn điểm, lưng phẳng.', 'Duỗi tay và chân đối diện thành đường thẳng, giữ 2 giây.', 'Về rồi đổi bên.'],
      mistakes: ['Xoay hông khi duỗi chân.'] },
    { id: 'crunch', name: 'Gập bụng (Crunch)', group: 'core', equip: 'Thảm', type: 'reps', inc: 0,
      steps: ['Nằm ngửa, gối co, tay đặt nhẹ sau đầu.', 'Cuộn vai lên khỏi sàn bằng cơ bụng.', 'Hạ chậm.'],
      mistakes: ['Kéo cổ bằng tay.'] },
    { id: 'mountain-climber', name: 'Leo núi (Mountain Climber)', group: 'cardio', equip: 'Không cần dụng cụ', type: 'time', inc: 0,
      steps: ['Tư thế chống đẩy cao.', 'Lần lượt kéo gối về ngực thật nhanh.', 'Giữ hông thấp, bụng siết.'],
      mistakes: ['Chổng mông cao.'] },
    { id: 'incline-walk', name: 'Đi bộ dốc trên máy chạy', group: 'cardio', equip: 'Máy chạy bộ', type: 'min', inc: 0,
      steps: ['Độ dốc 6–10%, tốc độ 4,5–5,5 km/h.', 'Không bám tay vịn.', 'Giữ mức thở còn nói chuyện được.'],
      mistakes: ['Bám tay vịn làm giảm tác dụng.'] },
    { id: 'bike', name: 'Đạp xe tại chỗ', group: 'cardio', equip: 'Xe đạp tập', type: 'min', inc: 0,
      steps: ['Chỉnh yên ngang hông.', 'Đạp đều, nhịp vừa phải.', 'Tăng dần thời gian mỗi tuần.'],
      mistakes: ['Yên quá thấp làm đau gối.'] },
    { id: 'bulgarian-split-squat', name: 'Bulgarian Split Squat', group: 'legs', equip: 'Ghế + tạ đơn', type: 'weight', inc: 1,
      steps: ['Mu bàn chân sau đặt lên ghế, chân trước bước xa khoảng 2 bàn chân, cầm tạ hai bên.', 'Hạ thẳng người xuống đến khi đùi trước gần song song sàn.', 'Đạp gót chân trước để đứng lên. Tập đủ số lần chân này rồi đổi chân; ghi số lần mỗi chân.'],
      mistakes: ['Gối trước đổ vào trong.', 'Dồn lực vào chân sau trên ghế.'] },
    { id: 'hip-abduction', name: 'Banh mông máy (Hip Abduction)', group: 'glutes', equip: 'Máy', type: 'weight', inc: 5,
      steps: ['Ngồi thẳng lưng sát đệm, đệm máy áp mặt ngoài gối.', 'Đẩy hai gối mở ra hết biên độ, giữ 1 giây.', 'Thả về chậm, không để tạ đập.'],
      mistakes: ['Đung đưa người lấy đà.', 'Thả tạ rơi tự do.'] },
    { id: 'stair-climber', name: 'Leo cầu thang máy (Stair Climber)', group: 'cardio', equip: 'Máy leo cầu thang', type: 'min', inc: 0,
      steps: ['Bắt đầu tốc độ thấp (1–3).', 'Đặt cả bàn chân lên bậc, đứng thẳng.', 'Chỉ chạm nhẹ tay vịn để giữ thăng bằng.'],
      mistakes: ['Gục người, chống cả thân lên tay vịn.'] },
    { id: 'band-squat', name: 'Squat với dây kháng lực', group: 'legs', equip: 'Dây kháng lực dài', type: 'reps', inc: 0,
      steps: ['Đứng lên giữa dây, chân rộng bằng vai; hai tay cầm hai đầu dây đưa lên ngang vai.', 'Đẩy hông ra sau, ngồi xuống đến khi đùi song song sàn.', 'Đạp cả bàn chân đứng lên; dây căng nhất ở trên cùng.'],
      mistakes: ['Gối đổ vào trong khi đứng lên.', 'Dây tuột khỏi chân — đặt dây giữa bàn chân.'] },
    { id: 'band-glute-kickback', name: 'Đá mông với dây mini', group: 'glutes', equip: 'Dây mini (vòng)', type: 'reps', inc: 0,
      steps: ['Quỳ bốn điểm, dây mini vòng quanh hai cổ chân (hoặc trên gối).', 'Giữ gối gập 90°, đạp gót chân lên trần đến khi đùi ngang lưng.', 'Siết mông 1 giây rồi hạ chậm. Tập đủ một bên rồi đổi chân.'],
      mistakes: ['Ưỡn lưng để đá cao hơn.', 'Xoay hông mở sang bên.'] },
    { id: 'band-lateral-walk', name: 'Đi ngang với dây mini (Lateral Walk)', group: 'glutes', equip: 'Dây mini (vòng)', type: 'reps', inc: 0,
      steps: ['Dây mini vòng trên cổ chân hoặc trên gối, chân rộng bằng vai.', 'Hạ thấp người như nửa squat, ngực mở.', 'Bước ngang 10–15 bước rồi đi ngược lại; luôn giữ dây căng. Ghi số bước mỗi bên.'],
      mistakes: ['Đứng thẳng người — mông không làm việc.', 'Gối đổ vào trong theo lực kéo của dây.'] },
    { id: 'band-clamshell', name: 'Mở gối nằm nghiêng (Clamshell)', group: 'glutes', equip: 'Dây mini (vòng)', type: 'reps', inc: 0,
      steps: ['Nằm nghiêng, gối gập khoảng 90°, dây mini vòng trên gối.', 'Giữ hai bàn chân chạm nhau, mở gối trên lên cao.', 'Giữ 1 giây rồi hạ chậm. Đủ số lần thì đổi bên.'],
      mistakes: ['Lăn hông ra sau khi mở gối.', 'Mở quá nhanh, thả dây giật về.'] },
    { id: 'band-glute-bridge', name: 'Glute Bridge với dây mini', group: 'glutes', equip: 'Dây mini (vòng)', type: 'reps', inc: 0,
      steps: ['Nằm ngửa, gối gập, dây mini vòng trên gối.', 'Đẩy gối hơi mở ra chống lại dây, đẩy hông lên.', 'Siết mông 1–2 giây ở trên rồi hạ chậm.'],
      mistakes: ['Gối khép vào theo dây.', 'Ưỡn lưng thay vì dùng mông.'] },
    { id: 'band-row', name: 'Kéo dây chèo đứng (Band Row)', group: 'back', equip: 'Dây kháng lực dài + chỗ neo', type: 'reps', inc: 0,
      steps: ['Neo dây vào cột hoặc khung cửa ngang ngực, lùi ra cho dây hơi căng.', 'Đứng chân rộng bằng vai, gối hơi chùng, ngực mở.', 'Kéo tay về bụng, khuỷu tay lướt sát người; ép hai bả vai rồi duỗi chậm.'],
      mistakes: ['Kéo bằng tay, nhún vai lên tai.', 'Ngả người ra sau lấy đà.'] },
    { id: 'band-pull-apart', name: 'Kéo dây kháng lực mở ngang ngực (Band Pull-Apart)', group: 'shoulders', equip: 'Dây kháng lực dài', type: 'reps', inc: 0,
      steps: ['Hai tay cầm dây rộng bằng vai, duỗi thẳng ngang ngực.', 'Kéo giãn dây sang hai bên đến khi dây chạm ngực, ép hai bả vai.', 'Về chậm, không để dây giật.'],
      mistakes: ['Nhún vai lên.', 'Gập khuỷu tay nhiều — giữ tay gần thẳng.'] },
    { id: 'band-chest-press', name: 'Đẩy ngực với dây', group: 'chest', equip: 'Dây kháng lực dài', type: 'reps', inc: 0,
      steps: ['Vòng dây sau lưng ngang nách, hai tay cầm hai đầu dây.', 'Đứng một chân trước một chân sau, gồng bụng.', 'Đẩy hai tay thẳng ra trước ngang ngực rồi về chậm.'],
      mistakes: ['Dây trượt lên cổ.', 'Ưỡn lưng khi đẩy.'] },
    { id: 'band-shoulder-press', name: 'Đẩy vai với dây', group: 'shoulders', equip: 'Dây kháng lực dài', type: 'reps', inc: 0,
      steps: ['Đứng lên giữa dây, hai tay cầm hai đầu dây ngang vai.', 'Gồng bụng, đẩy tay thẳng lên trên đầu.', 'Hạ chậm về ngang vai.'],
      mistakes: ['Ưỡn lưng dưới khi đẩy.', 'Khuỷu tay xoè quá rộng ra sau.'] },
    { id: 'band-curl', name: 'Cuốn tay với dây', group: 'arms', equip: 'Dây kháng lực dài', type: 'reps', inc: 0,
      steps: ['Đứng lên giữa dây, hai tay cầm hai đầu, lòng bàn tay hướng ra trước.', 'Giữ khuỷu tay sát người, cuốn tay lên vai.', 'Hạ chậm đến khi tay gần thẳng.'],
      mistakes: ['Đung đưa người lấy đà.', 'Khuỷu tay đưa ra trước.'] },
    { id: 'band-triceps-ext', name: 'Ép tay sau với dây', group: 'arms', equip: 'Dây kháng lực dài + chỗ neo cao', type: 'reps', inc: 0,
      steps: ['Neo dây trên cao (khung cửa), hai tay cầm dây.', 'Khuỷu tay ép sát người, duỗi tay xuống đến khi thẳng.', 'Về chậm đến khi cẳng tay ngang ngực.'],
      mistakes: ['Khuỷu tay rời khỏi người.', 'Gập người dùng sức lưng.'] },
    { id: 'band-lat-pulldown', name: 'Kéo xô với dây', group: 'back', equip: 'Dây kháng lực dài + chỗ neo cao', type: 'reps', inc: 0,
      steps: ['Neo dây trên cao, cầm dây rộng hơn vai, tay duỗi lên.', 'Kéo khuỷu tay xuống và ra sau đến khi tay ngang cằm.', 'Ép xô 1 giây rồi đưa tay lên chậm.'],
      mistakes: ['Kéo bằng tay, không dùng lưng.', 'Ngả người quá nhiều ra sau.'] },
    { id: 'jump-rope', name: 'Nhảy dây', group: 'cardio', equip: 'Dây nhảy', type: 'min', inc: 0,
      steps: ['Cầm dây hai tay ngang hông, khuỷu tay sát người.', 'Quay dây bằng cổ tay, bật nhẹ bằng mũi chân vừa đủ dây qua.', 'Người mới: nhảy 30–60 giây, nghỉ 30 giây, lặp lại cho đủ số phút.'],
      mistakes: ['Bật quá cao, tiếp đất bằng gót.', 'Quay dây bằng cả cánh tay.'] },
    { id: 'band-w-pulldown', name: 'Kéo dây kháng lực chữ W xuống (Band W Pulldown)', group: 'back', equip: 'Dây kháng lực dài', type: 'reps', inc: 0,
      steps: ['Cầm dây rộng hơn vai, đưa thẳng hai tay lên trên đầu, dây hơi căng.', 'Kéo giãn dây sang hai bên, hạ khuỷu tay xuống sát sườn để tay thành hình chữ W; dây xuống ngang gáy (vai cứng thì kéo xuống trước mặt).', 'Ép hai bả vai xuống và vào trong 1 giây, rồi đưa tay lên chậm.'],
      mistakes: ['Nhún vai lên tai.', 'Đẩy đầu ra trước, ưỡn lưng.', 'Để dây chùng ở trên đầu.'] },
    { id: 'band-ext-rot', name: 'Xoay ngoài khớp vai với dây (Band External Rotation)', group: 'shoulders', equip: 'Dây kháng lực dài (dây nhẹ)', type: 'reps', inc: 0,
      steps: ['Đứng thẳng, hai tay cầm dây cách nhau khoảng một gang tay; khuỷu tay gập 90°, ép sát sườn, cẳng tay song song sàn.', 'Giữ khuỷu tay dính sườn, xoay cẳng tay ra ngoài để kéo giãn dây (như mở cửa hai cánh).', 'Giữ 1 giây rồi về chậm. Có thể kẹp khăn nhỏ giữa khuỷu tay và sườn để nhớ giữ khuỷu.'],
      mistakes: ['Khuỷu tay rời khỏi sườn.', 'Nhún vai hoặc ưỡn lưng để xoay được xa hơn.', 'Dùng dây quá nặng — bài này cần dây nhẹ, đi chậm.'] },
    { id: 'neck-chin-tuck', name: 'Gập cằm nằm ngửa (Chin Tuck)', group: 'neck', equip: 'Giường + gối mỏng', type: 'reps', inc: 0,
      steps: ['Nằm ngửa trên giường, gối mỏng dưới đầu, mắt nhìn trần.', 'Thu cằm vào như gật nhẹ, ấn nhẹ gáy xuống gối; đầu không nhấc lên.', 'Giữ 5 giây rồi thả lỏng. Mỗi hiệp 10 lần.'],
      mistakes: ['Nhấc cả đầu khỏi gối.', 'Ngửa cằm lên trần.', 'Gồng hàm, nín thở.'] },
    { id: 'neck-press-back', name: 'Ấn gáy xuống gối (giữ tĩnh)', group: 'neck', equip: 'Giường + gối', type: 'time', inc: 0,
      steps: ['Nằm ngửa, đầu trên gối, cằm hơi thu.', 'Ấn nhẹ phía sau đầu xuống gối khoảng 30–50% sức, đầu không di chuyển.', 'Giữ 10 giây, thả lỏng 5 giây. Ghi số giây giữ mỗi lần.'],
      mistakes: ['Ấn quá mạnh gây nhức đầu.', 'Ngửa cằm khi ấn.', 'Nín thở.'] },
    { id: 'neck-rotation', name: 'Xoay đầu chậm nằm ngửa', group: 'neck', equip: 'Giường + gối', type: 'reps', inc: 0,
      steps: ['Nằm ngửa, đầu trên gối, cằm hơi thu.', 'Quay đầu chậm sang một bên đến khi thấy căng nhẹ, giữ 2 giây.', 'Về giữa rồi sang bên kia. Mỗi bên tính 1 lần.'],
      mistakes: ['Quay nhanh, giật cổ.', 'Nhấc vai theo đầu.', 'Cố quay quá tầm đến mức đau.'] },
    { id: 'neck-side-bend', name: 'Nghiêng tai về vai nằm ngửa', group: 'neck', equip: 'Giường + gối', type: 'reps', inc: 0,
      steps: ['Nằm ngửa, đầu trên gối, mặt nhìn trần.', 'Trượt tai về phía vai (không quay mặt) đến khi căng nhẹ bên đối diện, giữ 5 giây.', 'Về giữa rồi đổi bên. Mỗi bên tính 1 lần.'],
      mistakes: ['Quay mặt thay vì nghiêng.', 'Kéo vai lên gặp tai.', 'Dùng tay kéo đầu mạnh.'] },
    { id: 'neck-head-lift', name: 'Gập cằm nâng đầu nằm ngửa', group: 'neck', equip: 'Giường', type: 'time', inc: 0,
      steps: ['Nằm ngửa, gối gập, bỏ gối kê đầu.', 'Thu cằm trước, rồi nhấc đầu lên khoảng 2–3 cm, vẫn giữ cằm thu.', 'Giữ 5–10 giây rồi hạ chậm. Ghi số giây giữ mỗi lần.'],
      mistakes: ['Nhấc đầu mà cằm chĩa lên (không thu cằm).', 'Nhấc quá cao, dùng bụng kéo người lên.', 'Cổ run mạnh hoặc đau — giảm thời gian giữ.'] },
    { id: 'neck-prone-lift', name: 'Nằm sấp nâng đầu (cổ sau)', group: 'neck', equip: 'Giường (đầu ra mép giường)', type: 'reps', inc: 0,
      steps: ['Nằm sấp, ngực ở mép giường, đầu thả nhẹ ra ngoài, tay xuôi theo người.', 'Thu cằm nhẹ, nâng đầu lên đến khi cổ thẳng hàng với lưng.', 'Giữ 3–5 giây rồi hạ chậm.'],
      mistakes: ['Ngửa đầu nhìn lên trước (gập gáy).', 'Nhấc vai, gồng lưng dưới.', 'Thả đầu rơi tự do.'] },
    { id: 'neck-side-lift', name: 'Nằm nghiêng nâng đầu', group: 'neck', equip: 'Giường', type: 'reps', inc: 0,
      steps: ['Nằm nghiêng, chân duỗi chồng lên nhau, bỏ gối kê đầu (hoặc gối thật mỏng).', 'Nhấc đầu lên về phía trần (tai hướng về vai trên), mặt nhìn thẳng.', 'Giữ 3 giây rồi hạ chậm. Đủ số lần thì đổi bên.'],
      mistakes: ['Xoay mặt xuống giường hoặc lên trần.', 'Nhún vai trên lên.', 'Nhấc quá cao gây đau.'] },
    { id: 'dyn-neck-circles', name: 'Xoay cổ chậm', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đứng thẳng, vai thả lỏng, cằm hơi thu.','Nghiêng tai về vai phải, cúi cằm xuống ngực, rồi nghiêng tai về vai trái (nửa vòng phía trước).','Đi ngược lại. Làm thật chậm, không ngửa cổ ra sau.'],
      mistakes: ['Xoay cả vòng, ngửa cổ ra sau.','Xoay nhanh, giật cổ.','Nhún vai theo đầu.'] },
    { id: 'dyn-shoulder-rolls', name: 'Xoay khớp vai (tay đặt lên vai)', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đứng thẳng, đầu ngón tay đặt lên vai cùng bên.','Vẽ vòng tròn lớn bằng khuỷu tay: ra trước, lên trên, ra sau, xuống dưới.','Làm 5 vòng ra trước rồi 5 vòng ra sau.'],
      mistakes: ['Vòng quá nhỏ.','Ưỡn lưng khi đưa khuỷu ra sau.'] },
    { id: 'dyn-elbow-circles', name: 'Xoay khuỷu tay (cẳng tay)', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Dang hai tay ngang vai, cánh tay giữ yên.','Xoay cẳng tay thành vòng tròn quanh khuỷu tay.','10 vòng vào trong, 10 vòng ra ngoài.'],
      mistakes: ['Hạ cánh tay xuống.','Nhún vai.'] },
    { id: 'dyn-wrist-circles', name: 'Xoay cổ tay', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đan hai bàn tay vào nhau trước ngực (hoặc nắm nhẹ hai tay).','Xoay cổ tay thành vòng tròn đều.','10 vòng mỗi chiều. Có thể kéo nhẹ từng ngón tay ra sau sau khi xoay.'],
      mistakes: ['Xoay nhanh, giật cổ tay.','Gồng vai.'] },
    { id: 'dyn-hip-circles', name: 'Xoay hông', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đứng chân rộng bằng vai, hai tay chống hông, gối hơi chùng.','Đẩy hông vẽ vòng tròn lớn: sang phải, ra sau, sang trái, ra trước.','5 vòng mỗi chiều. Đầu và vai gần như đứng yên.'],
      mistakes: ['Lắc cả người theo hông.','Khoá gối thẳng.'] },
    { id: 'dyn-knee-circles', name: 'Xoay gối', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đứng khép chân, gối chùng, hai tay đặt lên gối.','Xoay gối thành vòng tròn nhỏ, bàn chân dính sàn.','5 vòng mỗi chiều, chậm và nhẹ.'],
      mistakes: ['Vòng quá lớn, đè mạnh tay lên gối.','Nhấc gót chân.'] },
    { id: 'dyn-ankle-circles', name: 'Xoay cổ chân', group: 'dynamic', equip: 'Không cần dụng cụ (vịn tường nếu cần)', type: 'reps', inc: 0,
      steps: ['Đứng một chân (vịn tường nếu cần), nhấc chân kia lên trước.','Xoay cổ chân vẽ vòng tròn bằng mũi chân.','5 vòng mỗi chiều rồi đổi chân.'],
      mistakes: ['Xoay cả cẳng chân thay vì cổ chân.','Nghiêng người, mất thăng bằng.'] },
    { id: 'dyn-side-lunge', name: 'Xoạc chân ngang động (Side Lunge)', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đứng chân rộng gấp đôi vai, mũi chân hơi mở ra ngoài, hai tay đưa ra trước.','Dồn người sang một bên, gập gối bên đó, đẩy hông ra sau; chân kia duỗi thẳng để giãn đùi trong.','Đẩy về giữa rồi sang bên kia. Mỗi bên tính 1 lần.'],
      mistakes: ['Gối gập vượt quá mũi chân, đổ vào trong.','Nhấc gót chân duỗi.','Cong lưng khi xuống.'] },
    { id: 'dyn-hip-opener', name: 'Xoay khớp háng (mở cổng hông)', group: 'dynamic', equip: 'Không cần dụng cụ (vịn tường nếu cần)', type: 'reps', inc: 0,
      steps: ['Đứng thẳng, tay chống hông hoặc vịn tường.', 'Nâng gối lên trước ngang hông, rồi mở gối sang ngang (như mở cổng), hạ chân xuống.', 'Làm 5 lần mở ra rồi 5 lần theo chiều ngược lại (từ ngang vào trước), rồi đổi chân.'],
      mistakes: ['Nghiêng người theo chân.', 'Gối thấp, vòng quá nhỏ.', 'Xoay nhanh, mất thăng bằng.'] },
    { id: 'dyn-skip-c', name: 'Skip C (nhảy sáo đá gót chạm mông)', group: 'dynamic', equip: 'Khoảng trống 10–15 m', type: 'reps', inc: 0,
      steps: ['Nhảy chân sáo về trước, mỗi bước chạm sàn hai lần bằng mũi chân.', 'Ở mỗi nhịp, đá gót chân lên chạm mông, đùi vẫn hướng xuống sàn.', 'Tay đánh theo nhịp chân. Đi 10–15 m rồi đi bộ về; ghi số lượt.'],
      mistakes: ['Đưa đùi ra trước thay vì chỉ gập gối.', 'Tiếp đất bằng gót.', 'Gập người ra trước.'] },
    { id: 'dyn-arm-circles', name: 'Xoay cánh tay vòng tròn', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đứng thẳng, hai tay duỗi.','Xoay tay thành vòng tròn lớn ra trước 10 lần, rồi ra sau 10 lần.','Đi từ vòng nhỏ đến vòng lớn, nhịp đều.'],
      mistakes: ['Nhún vai lên tai.','Xoay quá nhanh, giật vai.'] },
    { id: 'dyn-torso-twist', name: 'Xoay thân đứng', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đứng chân rộng hơn vai, gối hơi chùng.','Xoay thân sang trái rồi sang phải, tay vung nhẹ theo người.','Hông giữ hướng ra trước, xoay từ eo và ngực. Mỗi bên tính 1 lần.'],
      mistakes: ['Vặn cả hông và gối theo.','Vung tay quá mạnh lấy đà.'] },
    { id: 'dyn-leg-swing', name: 'Đá lăng chân trước – sau', group: 'dynamic', equip: 'Không cần dụng cụ (vịn tường nếu cần)', type: 'reps', inc: 0,
      steps: ['Đứng thẳng, một tay vịn tường hoặc ghế.','Đá lăng một chân ra trước rồi ra sau, biên độ tăng dần.','Thân giữ thẳng. Đủ 10 lần thì đổi chân.'],
      mistakes: ['Cong lưng theo chân.','Đá giật mạnh ngay từ đầu.'] },
    { id: 'dyn-leg-swing-side', name: 'Đá lăng chân sang ngang', group: 'dynamic', equip: 'Không cần dụng cụ (vịn tường nếu cần)', type: 'reps', inc: 0,
      steps: ['Đứng thẳng, hai tay vịn tường hoặc dang ngang giữ thăng bằng.','Đá lăng một chân sang ngang rồi đưa chéo qua trước chân trụ.','Mũi chân hướng ra trước. Đủ 10 lần thì đổi chân.'],
      mistakes: ['Nghiêng người theo chân.','Xoay mũi chân lên trần.'] },
    { id: 'dyn-cat-cow', name: 'Mèo – bò (Cat-Cow)', group: 'dynamic', equip: 'Thảm', type: 'reps', inc: 0,
      steps: ['Quỳ bốn điểm: tay dưới vai, gối dưới hông.','Thở ra, cong lưng lên như con mèo, cằm thu vào ngực.','Hít vào, võng lưng xuống, ngẩng nhẹ đầu và ngực lên. Chậm theo nhịp thở.'],
      mistakes: ['Làm quá nhanh, không theo nhịp thở.','Ngửa cổ quá mức.'] },
    { id: 'dyn-high-knees', name: 'Nâng gối cao tại chỗ', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'time', inc: 0,
      steps: ['Đứng thẳng, nâng gối luân phiên lên ngang hông.','Tay đánh theo nhịp chân, tiếp đất nhẹ bằng mũi chân.','Làm 20–30 giây, tăng tốc dần.'],
      mistakes: ['Ngả người ra sau.','Tiếp đất mạnh bằng gót.'] },
    { id: 'dyn-butt-kicks', name: 'Đá gót chạm mông', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'time', inc: 0,
      steps: ['Chạy tại chỗ, đá gót chân về phía mông.','Đùi giữ hướng xuống sàn, thân thẳng.','Làm 20–30 giây.'],
      mistakes: ['Gập người ra trước.','Đưa đùi ra trước thay vì chỉ gập gối.'] },
    { id: 'dyn-squat-reach', name: 'Squat vươn tay lên', group: 'dynamic', equip: 'Không cần dụng cụ', type: 'reps', inc: 0,
      steps: ['Đứng chân rộng bằng vai, ngồi xuống squat, tay đưa ra trước.','Đứng lên, vươn hai tay thẳng lên trần, kiễng nhẹ.','Nhịp đều, 8–10 lần.'],
      mistakes: ['Gối đổ vào trong.','Ưỡn lưng khi vươn tay.'] },
    { id: 'st-hamstring', name: 'Giãn đùi sau ngồi duỗi chân', group: 'static', equip: 'Thảm', type: 'time', inc: 0,
      steps: ['Ngồi duỗi thẳng hai chân, mũi chân hướng lên.','Giữ lưng thẳng, gập người từ hông, tay với về phía mũi chân.','Dừng ở chỗ căng vừa, thở đều, giữ 20–30 giây.'],
      mistakes: ['Cong lưng để với cho xa.','Nhún nhảy, nín thở.'] },
    { id: 'st-quad', name: 'Giãn đùi trước đứng', group: 'static', equip: 'Không cần dụng cụ (vịn tường nếu cần)', type: 'time', inc: 0,
      steps: ['Đứng một chân, tay cùng bên cầm cổ chân kia kéo gót về mông.','Hai gối sát nhau, siết nhẹ mông, hông đẩy ra trước.','Giữ 20–30 giây rồi đổi chân.'],
      mistakes: ['Gối co mở ra ngoài.','Ưỡn lưng, gập người ra trước.'] },
    { id: 'st-hip-flexor', name: 'Giãn cơ gập hông quỳ một chân', group: 'static', equip: 'Thảm', type: 'time', inc: 0,
      steps: ['Quỳ một chân, chân kia bước ra trước, gối trước 90°.','Siết mông bên chân quỳ, đẩy hông nhẹ ra trước đến khi căng phía trước hông.','Giữ 20–30 giây rồi đổi bên.'],
      mistakes: ['Ưỡn lưng thay vì đẩy hông.','Gối trước vượt xa mũi chân.'] },
    { id: 'st-calf-wall', name: 'Giãn bắp chân chống tường', group: 'static', equip: 'Tường', type: 'time', inc: 0,
      steps: ['Hai tay chống tường, một chân lùi ra sau, gót ép xuống sàn.','Gối sau thẳng, dồn người về phía tường đến khi căng bắp chân.','Giữ 20–30 giây rồi đổi chân.'],
      mistakes: ['Nhấc gót sau lên.','Mũi chân sau xoay ra ngoài.'] },
    { id: 'st-child-pose', name: 'Tư thế em bé (Child\'s Pose)', group: 'static', equip: 'Thảm', type: 'time', inc: 0,
      steps: ['Quỳ, ngồi lên gót chân, gối hơi tách.','Gập người ra trước, trán chạm thảm, hai tay vươn dài.','Thả lỏng lưng và vai, thở sâu, giữ 30–45 giây.'],
      mistakes: ['Gồng vai, nín thở.','Ép quá mức khi đau gối — kê gối dưới mông.'] },
    { id: 'st-chest-doorway', name: 'Giãn ngực ở khung cửa', group: 'static', equip: 'Khung cửa / tường', type: 'time', inc: 0,
      steps: ['Đặt cẳng tay lên khung cửa, khuỷu ngang vai, gập 90°.','Bước nhẹ một chân ra trước, xoay người ra xa đến khi căng ngực.','Giữ 20–30 giây rồi đổi bên.'],
      mistakes: ['Nhún vai lên.','Ưỡn lưng để đẩy người ra trước.'] },
    { id: 'st-shoulder-cross', name: 'Kéo tay ngang ngực (giãn vai sau)', group: 'static', equip: 'Không cần dụng cụ', type: 'time', inc: 0,
      steps: ['Đưa một tay ngang qua trước ngực.','Tay kia ép nhẹ trên khuỷu tay, kéo về phía ngực.','Vai thả xuống, giữ 20–30 giây rồi đổi tay.'],
      mistakes: ['Nhún vai lên tai.','Xoay thân theo tay.'] },
    { id: 'st-triceps-overhead', name: 'Giãn tay sau qua đầu', group: 'static', equip: 'Không cần dụng cụ', type: 'time', inc: 0,
      steps: ['Đưa một tay lên cao, gập khuỷu để bàn tay chạm lưng trên.','Tay kia ấn nhẹ khuỷu tay xuống và vào giữa.','Giữ 20–30 giây rồi đổi tay.'],
      mistakes: ['Cúi đầu, đẩy cổ ra trước.','Ưỡn lưng.'] },
    { id: 'st-side-bend', name: 'Nghiêng người giãn sườn', group: 'static', equip: 'Không cần dụng cụ', type: 'time', inc: 0,
      steps: ['Đứng chân rộng bằng vai, một tay chống hông.','Đưa tay kia qua đầu, nghiêng người sang bên chống hông.','Giữ 20–30 giây rồi đổi bên.'],
      mistakes: ['Gập người ra trước thay vì nghiêng ngang.','Xoay hông theo.'] },

  function anatThumb(ex) {

      <section>

      <section>
        <h2>Buổi tự chọn</h2>

  // ================= WORKOUT =================
  function drawWorkout(v) {
    header(A.title, '', `<div class="row" style="flex-wrap:nowrap"><button class="btn sm${A.pausedAt ? ' primary' : ''}" data-act="pause" aria-label="${A.pausedAt ? 'Tiếp tục buổi tập' : 'Tạm dừng buổi tập'}">${A.pausedAt ? '▶ Tiếp' : '⏸ Dừng'}</button><button class="btn sm" data-act="add-ex">+ Bài</button></div>`, false);
    v.classList.toggle('is-paused', Boolean(A.pausedAt));
    $('#hTitle').innerHTML = `<span id="elapsed" class="num">0:00</span>`;
    const doneSets = A.items.reduce((n, it) => n + it.sets.filter((s) => s.done).length, 0);
    const allSets = A.items.reduce((n, it) => n + it.sets.length, 0);
    v.innerHTML = `
      <div class="row between"><span class="muted small num">${doneSets}/${allSets} hiệp đã xong</span><button class="btn sm ghost" data-act="cancel-workout">Huỷ buổi</button></div>
      <div id="cancelBox"></div>
      ${A.pausedAt ? `<div class="paused"><div><b>Đang tạm dừng</b><br>Từ ${new Date(A.pausedAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}. Đồng hồ buổi tập và giờ nghỉ đã dừng.</div><button class="btn primary" data-act="pause">▶ Tiếp tục tập</button></div>` : ''}
      ${A.coachNote ? `<div class="hint pt">HLV ${esc((D.link && D.link.coachName) || '')} dặn: ${richNote(A.coachNote)}</div>` : ''}
      ${(A.coachMedia || []).length ? `<div class="media-box"><b>Ảnh/video HLV gửi</b>${coachTiles(A.coachMedia)}</div>` : ''}
      ${foldWorkout(A.items.map((it, i) => {
        const ex = exById(it.ex);
        const one = ex.type !== 'weight';
        const complete = it.sets.length && it.sets.every((s) => s.done);
        return `<div class="ex-card ${complete ? 'complete' : ''}">
          <div class="ex-head">
            <div class="t">
              <button class="ex-name" data-act="ex-info" data-id="${esc(it.ex)}">${esc(ex.name)}</button>
              <div class="sub">${GROUPS[ex.group] || ''} · mục tiêu ${targetText(ex.type, it.target.sets, it.target.range || it.target.reps)}${it.restText ? ` · nghỉ ${esc(it.restText)}` : it.rest ? ` · nghỉ ${it.rest >= 60 ? fmt(it.rest / 60) + ' phút' : it.rest + ' giây'}` : ''}</div>
            </div>
            <button class="rm" data-act="rm-ex" data-i="${i}" aria-label="Bỏ bài ${esc(ex.name)}">×</button>
          </div>
          ${it.cue ? `<div class="hint pt">${A.source && A.source.type === 'routine' ? 'Lưu ý' : `PT ${esc(A.coach || D.settings.ptName || DEFAULT_PT)} dặn`}: ${richNote(it.cue)}</div>` : ''}
          ${tipsFor(ex).personal.map((x) => `<div class="hint pt">HLV dặn riêng bạn: ${richNote(x)}</div>`).join('')}
          ${(() => { const tp = tipsFor(ex); const first = tp.cues[0]; return `<details class="tips" data-tip="${esc(it.ex)}" ${S.openTips.has(it.ex) ? 'open' : ''}><summary>${esc(first || 'Mẹo hít thở')}</summary><div class="in">
            <div style="max-width:340px;margin:0 auto;width:100%">${exArt(ex, { anim: true })}</div>${muscleLegend(ex)}
            ${tp.cues.length > 1 ? `<ul>${tp.cues.slice(1).map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
            <div><span class="tip-label">Hít thở</span><br>${esc(tp.breath)}</div>
            ${ex.type !== 'min' ? `<div><span class="tip-label">Gồng core</span><br>${esc(BRACE)}</div>` : ''}
          </div></details>`; })()}
          ${it.why ? `<div class="hint">${esc(it.why)}</div>` : ''}
          <div class="sets">
            <div class="set ${one ? 'one' : ''} set-head"><span style="text-align:center">Hiệp</span>${one ? '' : '<span style="text-align:center">kg</span>'}<span style="text-align:center">${unit(ex.type)}</span><span></span></div>
            ${it.sets.map((s, j) => `
              <div class="set ${one ? 'one' : ''} ${s.done ? 'done' : ''}">
                <span class="idx">${j + 1}</span>
                ${one ? '' : `<input id="kg-${i}-${j}" inputmode="decimal" data-i="${i}" data-s="${j}" data-f="kg" value="${s.kg ?? ''}" placeholder="kg" aria-label="Kg hiệp ${j + 1}">`}
                <input id="rp-${i}-${j}" inputmode="numeric" data-i="${i}" data-s="${j}" data-f="reps" value="${s.reps ?? ''}" placeholder="${unit(ex.type)}" aria-label="${unit(ex.type)} hiệp ${j + 1}">
                <button class="check" data-act="toggle-set" data-i="${i}" data-s="${j}" aria-label="Hoàn thành hiệp ${j + 1}" aria-pressed="${s.done}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                </button>
              </div>`).join('')}
          </div>
          <div class="ex-foot">
            <button class="btn sm" data-act="add-set" data-i="${i}">+ Hiệp</button>
            ${it.sets.length > 1 ? `<button class="btn sm ghost" data-act="rm-set" data-i="${i}">− Hiệp</button>` : ''}
          </div>
          <input class="note-in" id="note-${i}" data-i="${i}" data-f="note" value="${esc(it.note)}" placeholder="Ghi chú bài này (cảm giác, kỹ thuật cần sửa…)" aria-label="Ghi chú ${esc(ex.name)}">
        </div>`;
      }))}
      ${A.items.length ? '' : '<div class="empty"><p>Chưa có bài nào. Bấm "+ Bài" để chọn từ thư viện.</p></div>'}
      <button class="btn block" data-act="add-ex">+ Thêm bài tập</button>
      <div class="media-box"><b>Ảnh/video tư thế${D.link ? ' gửi HLV' : ''}</b>
        <div class="sub">${D.link ? 'Nhờ bạn tập quay 10–20 giây một hiệp, HLV sẽ xem và sửa tư thế cho bạn.' : 'Lưu ảnh/video để tự xem lại tư thế. Kết nối HLV để gửi cho HLV xem.'}</div>
        ${mediaTiles(mediaOf('workout', A.id), true)}
        <label class="btn" style="position:relative;overflow:hidden">📷 Chụp ảnh / quay video<input type="file" accept="image/*,video/*" data-media-ref="workout:${esc(A.id)}" style="position:absolute;inset:0;opacity:0"></label></div>`;
  }
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (!A || S.view !== 'workout' || el.dataset.i == null) return;
    const it = A.items[Number(el.dataset.i)];
    if (!it) return;
    if (el.dataset.f === 'note') it.note = el.value;
    else it.sets[Number(el.dataset.s)][el.dataset.f] = num(el.value);
    saveActive();
  });

  function finishSheet() {
    const done = A.items.reduce((n, it) => n + it.sets.filter((s) => s.done).length, 0);
    let feeling = null;
    const FEEL = ['Rất mệt', 'Mệt', 'Ổn', 'Tốt', 'Rất tốt'];
    openSheet(`${sheetHead('Kết thúc buổi tập')}
      <div class="muted">${done} hiệp đã hoàn thành · ${mmss(activeMs() / 1000)} phút</div>
      ${done ? '' : '<div class="confirm">Chưa có hiệp nào được tick hoàn thành. Bạn có thể quay lại tick, hoặc huỷ buổi này.</div>'}
      <section><h3>Hôm nay thấy thế nào?</h3>
        <div class="scale" id="feel">${FEEL.map((l, i) => `<button type="button" data-v="${i + 1}" aria-pressed="false"><b>${i + 1}</b>${l}</button>`).join('')}</div></section>
      <label class="f">Nhật ký: điều làm tốt, điều cần cải thiện lần sau<textarea id="fNote" placeholder="VD: Squat hiệp cuối gối hơi đổ vào, lần sau giảm tốc độ xuống. Ngủ ít nên hơi đuối."></textarea></label>
      <button class="btn primary block" id="fSave" ${done ? '' : 'disabled'}>Lưu vào nhật ký</button>
      <button class="btn block" data-act="close-sheet">Tập tiếp</button>`, (root) => {
      $('#feel', root).addEventListener('click', (e) => {
        const b = e.target.closest('[data-v]'); if (!b) return;
        feeling = Number(b.dataset.v);
        $$('#feel button', root).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      });
      $('#fSave', root).addEventListener('click', () => {
        const items = A.items.map((it) => ({ ex: it.ex, cue: it.cue, target: it.target, note: it.note.trim(), sets: it.sets.filter((s) => s.done).map((s) => ({ kg: s.kg, reps: s.reps, done: true })) }))
          .filter((it) => it.sets.length || it.note);
        const w = { id: A.id, title: A.title, source: A.source, coachMedia: A.coachMedia || [], date: iso(new Date(A.startedAt)), startedAt: A.startedAt,
          minutes: Math.max(1, Math.round(activeMs() / 60000)), feeling, note: $('#fNote', root).value.trim(), items };
        D.workouts.push(w);
        if (A.source && A.source.type === 'program' && A.source.programId === D.program.id) {
          const p = PROGRAMS.find((x) => x.id === D.program.id);
          D.program.next = (A.source.day + 1) % p.days.length;
        }
        save();
        A = null; rest = null; saveActive(true);
        try { wakeLock && wakeLock.release(); } catch { /* ignore */ }
        closeSheet(); toast(D.link ? 'Đã lưu buổi tập và gửi cho HLV' : 'Đã lưu buổi tập vào nhật ký');
        syncNow(false);
        go('log');
      });
    });
  }

  // ================= PICKER (exercise library multi/single select) =================
  function openPicker({ title, multi, selected = [], onDone }) {
    const sel = new Set(selected);
    let group = 'all', q = '';
    const body = $('#pickerBody');
    const drawList = () => {
      const items = allEx().filter((e) => (group === 'all' || e.group === group) && (!q || e.name.toLowerCase().includes(q.toLowerCase())));
      $('#pickList', body).innerHTML = items.map((e) => `
        <button class="pick" type="button" data-id="${esc(e.id)}" aria-pressed="${sel.has(e.id)}">
          <span class="box">${sel.has(e.id) ? '✓' : ''}</span>
          <span class="grow"><span class="card-title" style="font-size:15px">${esc(e.name)}</span><br><span class="sub">${GROUPS[e.group]} · ${esc(e.equip || '')}</span></span>
        </button>`).join('') || '<p class="muted">Không tìm thấy. Thêm bài riêng ở tab Thư viện.</p>';
      const cnt = $('#pickCount', body); if (cnt) cnt.textContent = sel.size ? `Thêm ${sel.size} bài` : 'Chọn bài';
    };
    body.innerHTML = `<div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" type="button" data-act="close-picker" aria-label="Đóng">×</button></div>
      <input class="search" id="pickQ" type="search" placeholder="Tìm bài (VD: squat, đẩy ngực)" aria-label="Tìm bài tập">
      <div class="chips-scroll" id="pickG">${[['all', 'Tất cả'], ...Object.entries(GROUPS)].map(([k, l]) => `<button type="button" data-g="${k}" aria-pressed="${k === 'all'}">${l}</button>`).join('')}</div>
      <div class="list" id="pickList"></div>
      ${multi ? '<button class="btn primary block" id="pickCount" type="button" style="position:sticky;bottom:0">Chọn bài</button>' : ''}`;
    $('#picker').hidden = false; document.body.style.overflow = 'hidden';
    drawList();
    $('#pickQ', body).addEventListener('input', (e) => { q = e.target.value.trim(); drawList(); });
    $('#pickG', body).addEventListener('click', (e) => {
      const b = e.target.closest('[data-g]'); if (!b) return; group = b.dataset.g;
      $$('#pickG button', body).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); drawList();
    });
    $('#pickList', body).addEventListener('click', (e) => {
      const b = e.target.closest('[data-id]'); if (!b) return;
      if (!multi) { closePicker(); onDone([b.dataset.id]); return; }
      sel.has(b.dataset.id) ? sel.delete(b.dataset.id) : sel.add(b.dataset.id); drawList();
    });
    if (multi) $('#pickCount', body).addEventListener('click', () => { const ids = [...sel]; closePicker(); onDone(ids); });
  }

  // ================= PT SESSION =================
  function ptSheet(p) {
    const isNew = !p;
    const f = p ? JSON.parse(JSON.stringify(p)) : { id: uid('p'), date: today(), title: '', coach: D.settings.ptName || DEFAULT_PT, note: '', items: [] };
    if (!f.coach) f.coach = D.settings.ptName || DEFAULT_PT;
    openSheet(`${sheetHead(isNew ? 'Ghi buổi tập với PT' : 'Buổi tập với PT')}
      <div class="f2">
        <label class="f">Ngày<input id="pDate" type="date" value="${esc(f.date)}"></label>
        <label class="f">Tên PT<input id="pCoach" maxlength="60" value="${esc(f.coach)}" placeholder="VD: anh Tuấn"></label>
      </div>
      <label class="f">Tên buổi<input id="pTitle" maxlength="80" value="${esc(f.title)}" placeholder="VD: Ngực + tay sau"></label>
      <section><div class="row between"><h3>Các bài PT đã dạy</h3><span class="muted small">hiệp × lần @ kg</span></div>
        <div class="list" id="pItems"></div>
        <button class="btn block" type="button" id="pAdd">+ Chọn bài từ thư viện</button></section>
      <label class="f">PT dặn chung (dinh dưỡng, lịch tập, lưu ý)<textarea id="pNote" maxlength="2000">${esc(f.note)}</textarea></label>
      <button class="btn primary block" id="pSave">Lưu buổi PT</button>
      ${isNew ? '' : '<button class="btn block" id="pStart">Tự tập lại buổi này</button><button class="btn danger block" id="pDel">Xoá</button><div id="pConfirm"></div>'}`, (root) => {
      const sync = () => {
        f.items = $$('.plan-item', root).map((r, i) => ({ ...f.items[i], sets: num($('[data-k=sets]', r).value) || 3, reps: num($('[data-k=reps]', r).value) || 10, kg: num(($('[data-k=kg]', r) || {}).value), cue: $('[data-k=cue]', r).value.trim() }));
      };
      const drawItems = () => {
        $('#pItems', root).innerHTML = f.items.map((it, i) => {
          const ex = exById(it.ex);
          return `<div class="plan-item">
            <div class="row between" style="flex-wrap:nowrap"><b style="overflow-wrap:anywhere">${esc(ex.name)}</b><button class="rm" type="button" data-rm="${i}" aria-label="Bỏ ${esc(ex.name)}">×</button></div>
            <div class="f3">
              <label class="mini">Hiệp<input id="pi-s-${i}" data-k="sets" inputmode="numeric" value="${it.sets ?? 3}"></label>
              <label class="mini">${ex.type === 'time' ? 'Giây' : ex.type === 'min' ? 'Phút' : 'Lần'}<input id="pi-r-${i}" data-k="reps" inputmode="numeric" value="${it.reps ?? 10}"></label>
              ${ex.type === 'weight' ? `<label class="mini">Kg<input id="pi-k-${i}" data-k="kg" inputmode="decimal" value="${it.kg ?? ''}"></label>` : '<span></span>'}
            </div>
            <input class="cue" id="pi-c-${i}" data-k="cue" maxlength="300" value="${esc(it.cue || '')}" placeholder="PT dặn gì ở bài này? (VD: siết mông ở trên)" aria-label="Lời dặn của PT">
          </div>`;
        }).join('') || '<p class="muted small" style="margin:0">Chưa chọn bài nào.</p>';
      };
      drawItems();
      $('#pItems', root).addEventListener('click', (e) => { const b = e.target.closest('[data-rm]'); if (!b) return; sync(); f.items.splice(Number(b.dataset.rm), 1); drawItems(); });
      $('#pAdd', root).addEventListener('click', () => {
        sync();
        openPicker({ title: 'Bài PT đã dạy', multi: true, selected: [], onDone: (ids) => {
          ids.forEach((id) => { const ex = exById(id); f.items.push({ ex: id, sets: ex.type === 'min' ? 1 : 3, reps: ex.type === 'time' ? 30 : ex.type === 'min' ? 10 : 10, kg: null, cue: '' }); });
          drawItems();
        } });
      });
      const collect = () => { sync(); return { ...f, date: $('#pDate', root).value || today(), coach: $('#pCoach', root).value.trim(), title: $('#pTitle', root).value.trim(), note: $('#pNote', root).value.trim() }; };
      $('#pSave', root).addEventListener('click', () => {
        const data = collect();
        if (!data.items.length) { toast('Chọn ít nhất một bài PT đã dạy.'); return; }
        const i = D.pt.findIndex((x) => x.id === data.id);
        i >= 0 ? (D.pt[i] = data) : D.pt.push(data);
        if (data.coach) D.settings.ptName = data.coach;
        save(); closeSheet(); toast('Đã lưu buổi PT'); render();
      });
      const st = $('#pStart', root);
      if (st) st.addEventListener('click', () => { const data = collect(); closeSheet(); startPt(data); });

  // ================= PROGRESS =================
  function lineChart(points, label, unitTxt) {
    if (points.length < 2) return `<div class="empty"><p>Cần ít nhất 2 lần ghi để vẽ biểu đồ ${esc(label)}.</p></div>`;
    const W = 340, H = 170, L = 38, R = 12, T = 14, B = 26;
    const ys = points.map((p) => p.v);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (hi - lo < 1) { lo -= 1; hi += 1; }
    const pd = (hi - lo) * 0.12; lo -= pd; hi += pd;
    const x = (i) => L + (points.length === 1 ? 0.5 : i / (points.length - 1)) * (W - L - R);
    const y = (val) => T + (1 - (val - lo) / (hi - lo)) * (H - T - B);
    const ticks = [lo + (hi - lo) * 0.15, (lo + hi) / 2, hi - (hi - lo) * 0.15];
    const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    const last = points[points.length - 1];
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ ${esc(label)}">
      ${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)"/><text x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${fmt(t)}</text>`).join('')}
      <path d="${d}L${x(points.length - 1).toFixed(1)},${H - B}L${x(0)},${H - B}Z" fill="var(--accent)" fill-opacity=".1"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      ${points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join('')}
      <circle cx="${x(points.length - 1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
      <text x="${L}" y="${H - 6}">${esc(fmtShort(points[0].d))}</text>
      <text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(fmtShort(last.d))} · ${fmt(last.v)} ${esc(unitTxt)}</text>
    </svg></div>`;
  }
  function drawProgress(v) {
    header('Tiến bộ', 'Bạn đã mạnh hơn', '', false);
    const t = today();
    const month = t.slice(0, 7);
    const monthCount = D.workouts.filter((w) => w.date.startsWith(month)).length;
    let streak = 0; let wk = weekStart(t);
    const weeks = new Set(D.workouts.map((w) => weekStart(w.date)));
    if (!weeks.has(wk)) wk = addDays(wk, -7);
    while (weeks.has(wk)) { streak++; wk = addDays(wk, -7); }
    const vol30 = D.workouts.filter((w) => w.date > addDays(t, -30)).reduce((n, w) => n + w.items.reduce((m, i) => m + i.sets.reduce((k, s) => k + (s.kg || 0) * (s.reps || 0), 0), 0), 0);

    const used = [...new Set(D.workouts.flatMap((w) => w.items.map((i) => i.ex)))].map(exById).sort((a, b) => a.name.localeCompare(b.name, 'vi'));
    if (!S.progEx || !used.some((e) => e.id === S.progEx)) S.progEx = used[0] ? used[0].id : null;
    let exBlock = '<div class="empty"><p>Tập vài buổi để thấy biểu đồ sức mạnh của từng bài.</p></div>';
    if (S.progEx) {
      const ex = exById(S.progEx);
      const rows = [...D.workouts].sort((a, b) => a.date.localeCompare(b.date)).map((w) => {
        const it = w.items.find((i) => i.ex === ex.id); if (!it || !it.sets.length) return null;
        const best = ex.type === 'weight' ? Math.max(...it.sets.map((s) => s.kg || 0)) : Math.max(...it.sets.map((s) => s.reps || 0));
        const er = ex.type === 'weight' ? Math.max(...it.sets.map((s) => e1rm(s.kg, s.reps))) : 0;
        const bestSet = ex.type === 'weight' ? it.sets.reduce((a, s) => ((s.kg || 0) > (a.kg || 0) ? s : a), it.sets[0]) : null;
        return { d: w.date, v: best, er, bestSet };
      }).filter(Boolean);
      const pr = rows.reduce((a, r) => (r.v > (a ? a.v : -1) ? r : a), null);
      const prE = rows.reduce((a, r) => Math.max(a, r.er), 0);
      exBlock = `
        <label class="f">Chọn bài<select id="progSel">${used.map((e) => `<option value="${esc(e.id)}" ${e.id === S.progEx ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select></label>
        ${lineChart(rows, ex.type === 'weight' ? 'mức tạ cao nhất' : unit(ex.type), ex.type === 'weight' ? 'kg' : unit(ex.type))}
        <div class="stats">
          <div class="stat"><span class="v">${pr ? fmt(pr.v) : '–'}</span><span class="k">Kỷ lục ${ex.type === 'weight' ? '(kg)' : '(' + unit(ex.type) + ')'}${pr ? ' · ' + esc(fmtShort(pr.d)) : ''}</span></div>
          <div class="stat"><span class="v">${prE ? fmt(prE, 0) : '–'}</span><span class="k">1RM ước tính (kg)</span></div>
          <div class="stat"><span class="v">${rows.length}</span><span class="k">Lần đã tập</span></div>
        </div>`;
    }
    const bw = [...D.journal].filter((j) => j.weight).sort((a, b) => a.date.localeCompare(b.date)).map((j) => ({ d: j.date, v: j.weight }));
    v.innerHTML = `
      <div class="stats">
        <div class="stat"><span class="v">${monthCount}</span><span class="k">Buổi tháng này</span></div>
        <div class="stat"><span class="v">${streak}</span><span class="k">Tuần liên tiếp có tập</span></div>
        <div class="stat"><span class="v">${fmt(vol30 / 1000, 1)}</span><span class="k">Tấn đã nâng 30 ngày</span></div>
      </div>
      <section><h2>Sức mạnh theo bài</h2>${exBlock}</section>
      <section><div class="row between"><h2>Cân nặng</h2><button class="btn sm" data-act="journal-new">+ Ghi cân nặng</button></div>${lineChart(bw, 'cân nặng', 'kg')}</section>
      <section><h2>Tính 1RM</h2>
        <div class="card">
          <div class="f2"><label class="f">Mức tạ (kg)<input id="rmKg" inputmode="decimal" placeholder="VD: 40"></label><label class="f">Số lần làm được<input id="rmReps" inputmode="numeric" placeholder="VD: 8"></label></div>
          <div id="rmOut" class="sub">Nhập mức tạ và số lần để ước tính mức tạ tối đa làm được 1 lần (công thức Epley). Người mới không nên thử 1RM thật.</div>
        </div>
      </section>`;
    const sel = $('#progSel'); if (sel) sel.onchange = () => { S.progEx = sel.value; render(); };
    const calc = () => {
      const kg = num($('#rmKg').value), r = num($('#rmReps').value);
      if (!kg || !r) return;
      const one = kg * (1 + r / 30);
      $('#rmOut').innerHTML = `<div class="num" style="font-size:15px;color:var(--ink)">1RM ước tính: <b>${fmt(one)} kg</b></div>
        <table class="t"><thead><tr><th>Mục tiêu</th><th class="r">% 1RM</th><th class="r">Mức tạ</th></tr></thead><tbody>
        ${[['Sức mạnh 3–5 lần', 0.85], ['Tăng cơ 8–12 lần', 0.72], ['Sức bền 15+ lần', 0.6]].map(([l, p]) => `<tr><td>${l}</td><td class="r">${Math.round(p * 100)}%</td><td class="r">${fmt(Math.round(one * p * 2) / 2)} kg</td></tr>`).join('')}
        </tbody></table>`;
    };
    $('#rmKg').oninput = calc; $('#rmReps').oninput = calc;
  }

  // ================= MEDIA (ảnh/video lưu trong IndexedDB của điện thoại) =================
  const MDB = (() => {
    let p;
    const open = () => (p ??= new Promise((res, rej) => {
      const r = indexedDB.open('nkt-media', 1);
      r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('blobs')) r.result.createObjectStore('blobs'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const run = async (mode, fn) => {
      const d = await open();
      return new Promise((res, rej) => {
        const t = d.transaction('blobs', mode); const q = fn(t.objectStore('blobs'));
        t.oncomplete = () => res(q ? q.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
    };
    return { put: (id, blob) => run('readwrite', (s) => s.put(blob, id)), get: (id) => run('readonly', (s) => s.get(id)), del: (id) => run('readwrite', (s) => s.delete(id)) };
  })();

    if (mediaUrls.has(id)) return mediaUrls.get(id);

      const u = URL.createObjectURL(b); mediaUrls.set(id, u);
      $$(`[data-mid="${id}"]`).forEach((el) => { el.src = u; });
    }).catch(() => {});
    return '';
  }
  async function shrinkImage(file, max, q) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('encode'))), 'image/jpeg', q));
  }

  const CHUNK = 500 * 1024; // ký tự base64 mỗi lần gửi
