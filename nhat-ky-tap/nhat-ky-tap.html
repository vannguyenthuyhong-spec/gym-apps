  // ---------- nén video nặng ngay trên điện thoại (vẽ lại khung hình nhỏ hơn + ghi lại với bitrate thấp, giữ tiếng) ----------
  const VIDEO_TARGET = 15 * 1024 * 1024; // nén về khoảng 15 MB (giới hạn gửi là 18 MB)
  const VIDEO_MAX_SEC = 90;
  const AUDIO_BPS = 96000;
  const canShrinkVideo = () => typeof MediaRecorder !== 'undefined' && typeof HTMLCanvasElement !== 'undefined' && 'captureStream' in HTMLCanvasElement.prototype;
  async function shrinkVideo(file, onProgress) {
    if (!canShrinkVideo()) return null;
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
    // Tiếng: dẫn tiếng của video vào bản ghi qua Web Audio (không phát ra loa)
    const AC = window.AudioContext || window.webkitAudioContext;
    let actx = null, audioTracks = [];
    try {
      if (AC) {
        actx = new AC();
        const dest = actx.createMediaStreamDestination();
        actx.createMediaElementSource(v).connect(dest);
        audioTracks = dest.stream.getAudioTracks();
        v.muted = false;
      }
    } catch { audioTracks = []; v.muted = true; }
    try {
      await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error('read')); setTimeout(() => rej(new Error('timeout')), 15000); });
      const full = Number.isFinite(v.duration) ? v.duration : VIDEO_MAX_SEC;
      const dur = Math.min(full, VIDEO_MAX_SEC);
      const scale = Math.min(1, 640 / Math.max(v.videoWidth || 640, v.videoHeight || 640));
      const c = document.createElement('canvas');
      c.width = Math.max(2, Math.round(((v.videoWidth || 640) * scale) / 2) * 2);
      c.height = Math.max(2, Math.round(((v.videoHeight || 360) * scale) / 2) * 2);
      const g = c.getContext('2d');
      const stream = c.captureStream(24);
      audioTracks.forEach((t) => stream.addTrack(t));
      const withAudio = audioTracks.length > 0;
      const types = withAudio
        ? ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
        : ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
      const mime = types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
      const bps = Math.max(250000, Math.min(1500000, Math.floor((VIDEO_TARGET * 8) / Math.max(1, dur)) - (withAudio ? AUDIO_BPS : 0)));
      const opts = { videoBitsPerSecond: bps, ...(withAudio ? { audioBitsPerSecond: AUDIO_BPS } : {}), ...(mime ? { mimeType: mime } : {}) };
      const rec = new MediaRecorder(stream, opts);
      const chunks = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const finished = new Promise((res) => { rec.onstop = res; });
      let stopped = false, timer = null;
      const stop = () => { if (stopped) return; stopped = true; clearInterval(timer); try { v.pause(); } catch { /* ignore */ } if (rec.state !== 'inactive') rec.stop(); };
      try { if (actx && actx.state === 'suspended') await actx.resume(); } catch { /* ignore */ }

      timer = setInterval(() => {
        g.drawImage(v, 0, 0, c.width, c.height);

        if (v.currentTime >= dur || v.ended) stop();

      if (file.size > MAX_VIDEO && !D.link && file.size > 300 * 1024 * 1024) { toast('Video lớn hơn 300 MB. Hãy quay đoạn ngắn hơn.'); return null; }
      if (file.size > MAX_VIDEO && D.link) {
        if (!canShrinkVideo()) { toast('Video lớn hơn 18 MB và máy này chưa nén tự động được. Hãy quay đoạn ngắn hơn (15–30 giây).'); return null; }
        toast('Video nặng, đang nén để gửi HLV… Giữ màn hình mở.');
        const r = await shrinkVideo(file, (p) => toast(`Đang nén video… ${p}%`));
        if (!r || r.blob.size > MAX_VIDEO) { toast('Chưa nén được video này. Hãy quay đoạn ngắn hơn (15–30 giây).'); return null; }
        blob = r.blob; mime = r.type;
        toast(`Đã nén video còn ${(r.blob.size / 1048576).toFixed(1)} MB${r.cut ? ' (video dài nên lấy 90 giây đầu)' : ''}`);
      }
    }
    const m = { id: uid('m'), kind: isVideo ? 'video' : 'image', mime, size: blob.size, date: today(), at: new Date().toISOString(), ref, uploaded: false, chunks: 0 };
    try { await MDB.put(m.id, blob); } catch { toast('Không lưu được tệp: bộ nhớ điện thoại đầy?'); return null; }
    D.media.push(m); save();
    return m;
  }
  async function removeMedia(id) {
    D.media = D.media.filter((m) => m.id !== id); save();
    try { await MDB.del(id); } catch { /* ignore */ }
  }
  const mediaOf = (type, refId) => D.media.filter((m) => m.ref && m.ref.type === type && m.ref.id === refId);
  const mediaTiles = (list, canRemove) => list.length ? `<div class="mgrid">${list.map((m) => `<div class="mtile">
      ${m.kind === 'video' ? `<video data-mid="${esc(m.id)}" src="${mediaSrc(m.id)}" controls playsinline preload="metadata"></video>` : `<img data-mid="${esc(m.id)}" src="${mediaSrc(m.id)}" alt="">`}
      ${D.link ? `<span class="mstate">${m.uploaded ? '✓ Đã gửi HLV' : 'Chờ gửi'}</span>` : ''}
      ${canRemove ? `<button class="mx" type="button" data-act="media-del" data-id="${esc(m.id)}" aria-label="Xoá tệp">×</button>` : ''}
    </div>`).join('')}</div>` : '';
  async function uploadPending() {
    if (!D.link) return;
    const auth = { pairId: D.link.pairId, traineeKey: D.link.traineeKey };
    const started = Date.now();
    for (const m of D.media.filter((x) => !x.uploaded)) {
      if (Date.now() - started > 90000) break; // phần còn lại gửi ở lần đồng bộ sau
      const blob = await MDB.get(m.id).catch(() => null);
      if (!blob) { m.uploaded = true; m.missing = true; continue; }
      const b64 = await blobB64(blob);
      const total = Math.max(1, Math.ceil(b64.length / CHUNK));
      for (let i = 0; i < total; i++) await api('media-put', { ...auth, id: m.id, idx: i, total, data: b64.slice(i * CHUNK, (i + 1) * CHUNK) });
      m.uploaded = true; m.chunks = total; save();
    }
  }

  // ================= DINH DƯỠNG =================
  // Khẩu phần theo bàn tay (ước lượng trung bình một khẩu phần)
  const PORTIONS = {
    protein: { l: 'Đạm', hint: '1 lòng bàn tay: thịt, cá, trứng, đậu phụ', kcal: 120, p: 24, c: 2, f: 3 },
    carb: { l: 'Tinh bột', hint: '1 nắm tay khum: cơm, bún, phở, khoai', kcal: 110, p: 3, c: 24, f: 0.5 },
    veg: { l: 'Rau củ', hint: '1 nắm tay: rau, củ, salad', kcal: 25, p: 1.5, c: 5, f: 0 },
    fat: { l: 'Chất béo', hint: '1 ngón cái: dầu mỡ, bơ, lạc, sốt', kcal: 90, p: 1, c: 1, f: 9.5 },
  };
  const SLOTS = { sang: 'Sáng', trua: 'Trưa', toi: 'Tối', phu: 'Bữa phụ' };
  const slotByHour = (h) => (h < 10 ? 'sang' : h < 15 ? 'trua' : h >= 17 && h < 22 ? 'toi' : 'phu');
  function handTotals(p, extra) {
    const t = { kcal: Number(extra) || 0, protein: 0, carb: 0, fat: 0 };
    for (const [k, v] of Object.entries(PORTIONS)) { const n = Number((p || {})[k]) || 0; t.kcal += n * v.kcal; t.protein += n * v.p; t.carb += n * v.c; t.fat += n * v.f; }
    return t;
  }
  const mealNums = (m) => (m.src === 'ai' && m.ai ? { kcal: m.ai.kcal, protein: m.ai.protein, carb: m.ai.carb, fat: m.ai.fat } : handTotals(m.portions, m.extraKcal));
  function nutriTarget() {
    const w = latestWeight() || 55, g = goalsOf(D.profile);
    let kcal = w * 31;
    if (g.includes('giam-mo') && g.includes('tang-co')) kcal -= 150;
    else if (g.includes('giam-mo')) kcal -= 400;
    else if (g.includes('tang-co')) kcal += 250;
    const protein = w * (g.includes('tang-co') ? 1.8 : 1.6);
    const o = D.settings.nutri || {};
    return { kcal: Math.round((o.kcal || kcal) / 10) * 10, protein: Math.round(o.protein || protein), custom: Boolean(o.kcal || o.protein) };
  }
  function dayTotals(date) {
    const t = { kcal: 0, protein: 0, carb: 0, fat: 0, n: 0 };
    for (const m of D.meals.filter((x) => x.date === date)) { const v = mealNums(m); t.kcal += v.kcal; t.protein += v.protein; t.carb += v.carb; t.fat += v.fat; t.n += 1; }
    return t;
  }
  const portionText = (p) => Object.entries(PORTIONS).filter(([k]) => (p || {})[k]).map(([k, v]) => `${fmt(p[k])} ${v.l.toLowerCase()}`).join(' · ');
  const bar = (v, max, cls) => `<div class="progress"><i class="${cls || ''}" style="width:${Math.min(100, max ? (v / max) * 100 : 0)}%"></i></div>`;

  function drawFood(v) {
    const t = today();
    const d = S.foodDate || t;
    header(d === t ? 'Hôm nay' : fmtLong(d), 'Ăn uống', `<button class="icon-btn" data-act="nutri-target" aria-label="Mục tiêu dinh dưỡng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg></button>`, false);
    const tg = nutriTarget(), tot = dayTotals(d);
    const meals = D.meals.filter((m) => m.date === d).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    const days7 = Array.from({ length: 7 }, (_, i) => addDays(t, -i)).map((x) => dayTotals(x)).filter((x) => x.n);
    const avg = (k) => (days7.length ? days7.reduce((s, x) => s + x[k], 0) / days7.length : null);
    const fbAll = D.feedback || {};
    v.innerHTML = `
      <div class="row between"><button class="btn sm" data-act="food-day" data-d="-1" aria-label="Ngày trước">‹ Trước</button>
        <b class="num">${esc(fmtShort(d))}</b>
        <button class="btn sm" data-act="food-day" data-d="1" ${d >= t ? 'disabled' : ''} aria-label="Ngày sau">Sau ›</button></div>
      <div class="card nutri">
        <div class="row between"><span class="card-title">Năng lượng</span><span class="num"><b>${fmt(tot.kcal, 0)}</b> / ${fmt(tg.kcal, 0)} kcal</span></div>
        ${bar(tot.kcal, tg.kcal, tot.kcal > tg.kcal * 1.1 ? 'over' : '')}
        <div class="row between"><span class="card-title">Đạm (protein)</span><span class="num"><b>${fmt(tot.protein, 0)}</b> / ${fmt(tg.protein, 0)} g</span></div>
        ${bar(tot.protein, tg.protein, 'good')}
        <div class="sub num">Tinh bột ${fmt(tot.carb, 0)} g · Chất béo ${fmt(tot.fat, 0)} g · ${tot.n} bữa${tg.custom ? '' : ' · mục tiêu ước lượng theo cân nặng và mục tiêu'}</div>
      </div>
      <div class="food-add">
        <label class="btn primary" style="position:relative;overflow:hidden">📷 Chụp bữa ăn<input type="file" accept="image/*" capture="environment" id="mealPhoto" style="position:absolute;inset:0;opacity:0"></label>
        <label class="btn" style="position:relative;overflow:hidden">Chọn ảnh có sẵn<input type="file" accept="image/*" id="mealPick" style="position:absolute;inset:0;opacity:0"></label>
        <button class="btn" data-act="meal-new">+ Ghi không ảnh</button>
      </div>
      <section><h2>Các bữa</h2>
        ${meals.length ? `<div class="list">${meals.map((m) => { const n = mealNums(m); const fb = fbAll[m.id]; return `
          <button class="meal" data-act="meal-edit" data-id="${esc(m.id)}">
            ${m.photo ? `<img data-mid="${esc(m.photo)}" src="${mediaSrc(m.photo)}" alt="">` : '<span class="ph">🍽</span>'}
            <span class="grow"><span class="row between"><b>${esc(SLOTS[m.slot] || 'Bữa ăn')}${m.time ? ' · ' + esc(m.time) : ''}</b><span class="num small">${fmt(n.kcal, 0)} kcal</span></span>
              <span class="sub">${esc(m.src === 'ai' && m.ai ? m.ai.items.map((i) => i.name).join(', ') : portionText(m.portions) || 'Chưa chọn khẩu phần')} · đạm ${fmt(n.protein, 0)} g</span>
              ${m.note ? `<span class="sub">${richNote(m.note)}</span>` : ''}
              ${fb ? `<span class="fb">HLV: ${richNote(fb)}</span>` : ''}</span>
          </button>`; }).join('')}</div>` : '<div class="empty"><p>Chưa ghi bữa nào. Chụp ảnh mỗi bữa ăn để theo dõi calo, đạm và gửi HLV xem.</p></div>'}
      </section>
      ${days7.length ? `<div class="stats">
        <div class="stat"><span class="v">${fmt(avg('kcal'), 0)}</span><span class="k">kcal TB/ngày (7 ngày)</span></div>
        <div class="stat"><span class="v">${fmt(avg('protein'), 0)}</span><span class="k">g đạm TB/ngày</span></div>
        <div class="stat"><span class="v">${days7.length}</span><span class="k">ngày có ghi</span></div></div>` : ''}
      <details class="tips"><summary>Ước lượng khẩu phần bằng bàn tay</summary><div class="in"><ul>
        ${Object.values(PORTIONS).map((p) => `<li><b>${esc(p.l)}</b>: ${esc(p.hint)} ≈ ${p.kcal} kcal${p.p >= 5 ? `, ${p.p} g đạm` : ''}</li>`).join('')}
        <li>Mỗi bữa chính gợi ý: 1–2 lòng bàn tay đạm, 1–2 nắm tinh bột, 1–2 nắm rau, 1 ngón cái chất béo.</li></ul>
        <div class="sub">Số liệu là ước lượng để theo dõi xu hướng, không thay cho tư vấn của chuyên gia dinh dưỡng.</div></div></details>`;
    const onPick = (inp) => inp.addEventListener('change', () => { const f = inp.files[0]; inp.value = ''; if (f) mealSheet(null, f); });
    onPick($('#mealPhoto')); onPick($('#mealPick'));
  }

  function mealSheet(meal, file) {
    const isNew = !meal;
    const now = new Date();
    const d = S.foodDate || today();
    const m = meal ? JSON.parse(JSON.stringify(meal)) : { id: uid('f'), date: d, time: d === today() ? `${pad(now.getHours())}:${pad(now.getMinutes())}` : '12:00',
      slot: slotByHour(d === today() ? now.getHours() : 12), portions: { protein: 0, carb: 0, veg: 0, fat: 0 }, extraKcal: null, note: '', photo: null, src: 'hand', ai: null };
    let photoBlob = null, aiBusy = false;
    const fb = (D.feedback || {})[m.id];
    openSheet(`${sheetHead(isNew ? 'Ghi bữa ăn' : 'Bữa ăn')}
      <div id="mPhotoBox"></div>
      <div class="seg" id="mSlot">${Object.entries(SLOTS).map(([k, l]) => `<button type="button" data-k="${k}" aria-pressed="${m.slot === k}">${l}</button>`).join('')}</div>
      <div class="f2"><label class="f">Ngày<input id="mDate" type="date" value="${esc(m.date)}"></label><label class="f">Giờ<input id="mTime" type="time" value="${esc(m.time || '')}"></label></div>

      <div class="card" id="mSum"></div>
      <label class="f">Ghi chú<textarea id="mNote" maxlength="300" placeholder="VD: cơm gà, uống trà sữa ít đường">${esc(m.note)}</textarea></label>
      ${fb ? `<div class="hint pt">HLV nhận xét: ${richNote(fb)}</div>` : ''}
      <button class="btn primary block" id="mSave">Lưu bữa ăn</button>
      ${!isNew ? '<button class="btn danger block" id="mDel">Xoá bữa này</button><div id="mConfirm"></div>' : ''}`, (root) => {

          `<label class="btn block" style="position:relative;overflow:hidden">📷 Thêm ảnh bữa ăn<input type="file" accept="image/*" capture="environment" id="mAddPhoto" style="position:absolute;inset:0;opacity:0"></label>`;
        const inp = $('#mAddPhoto', root);
        if (inp) inp.onchange = async () => { const f = inp.files[0]; if (!f) return; try { photoBlob = await shrinkImage(f, 1024, 0.78); drawPhoto(); drawAi(); } catch { toast('Ảnh này không đọc được. Hãy chọn ảnh JPG.'); } };
      };
      const drawPortions = () => {
        $('#mPortions', root).innerHTML = Object.entries(PORTIONS).map(([k, p]) => `<div class="portion">
          <span class="grow"><b>${esc(p.l)}</b><span class="sub">${esc(p.hint)}</span></span>
          <button class="btn sm" type="button" data-pk="${k}" data-step="-0.5" aria-label="Bớt ${esc(p.l)}">−</button>
          <b class="num pv">${fmt(m.portions[k] || 0)}</b>

          <div class="sub num">Đạm ${fmt(n.protein, 0)} g · Tinh bột ${fmt(n.carb, 0)} g · Chất béo ${fmt(n.fat, 0)} g</div>
          ${m.ai ? `<div class="seg" id="mSrc"><button type="button" data-src="ai" aria-pressed="${m.src === 'ai'}">Dùng số AI</button><button type="button" data-src="hand" aria-pressed="${m.src !== 'ai'}">Dùng khẩu phần (${fmt(hand.kcal, 0)} kcal)</button></div>` : ''}`;

            ${m.ai.isFood === false ? '<div class="sub">AI không thấy đồ ăn trong ảnh.</div>' : `<ul class="ai-items">${m.ai.items.map((i) => `<li><span>${esc(i.name)}${i.amount ? ` <span class="sub">(${esc(i.amount)})</span>` : ''}</span><span class="num">${fmt(i.kcal, 0)} kcal · ${fmt(i.protein, 0)} g đạm</span></li>`).join('')}</ul>`}
            ${m.ai.comment ? `<div class="sub">${esc(m.ai.comment)}</div>` : ''}
            ${has ? '<button class="btn sm ghost" type="button" id="mAi">Ước lượng lại</button>' : ''}</div>`
          : has ? `<button class="btn block ai-btn" type="button" id="mAi">✨ AI ước lượng calo từ ảnh</button><div class="sub">${D.link ? 'Gửi ảnh cho AI để đoán món và calo; bạn vẫn sửa được.' : 'Cần kết nối với HLV để dùng AI.'}</div>` : '';
        const b = $('#mAi', root);
        if (b) b.onclick = async () => {

          if (aiBusy) return; aiBusy = true; b.disabled = true; b.textContent = 'AI đang xem ảnh…';
          try {
            const src = photoBlob || await MDB.get(m.photo);

            m.ai = res; m.src = res.isFood === false ? 'hand' : 'ai';
            if (!$('#mNote', root).value.trim() && res.items.length) $('#mNote', root).value = res.items.map((i) => i.name).join(', ');
          } catch (err) { toast(err.message || 'AI chưa trả lời được.'); }
          aiBusy = false; drawAi(); drawSum();

      drawPhoto(); drawPortions(); drawAi(); drawSum();

      root.addEventListener('click', (e) => {

        const sr = e.target.closest('#mSrc [data-src]');

      $('#mExtra', root).addEventListener('input', drawSum);
      $('#mSave', root).onclick = async () => {
        m.date = $('#mDate', root).value || m.date; m.time = $('#mTime', root).value; m.note = $('#mNote', root).value.trim(); m.extraKcal = num($('#mExtra', root).value);

        save(); closeSheet(); S.foodDate = m.date; toast(D.link ? 'Đã lưu bữa ăn, sẽ gửi HLV' : 'Đã lưu bữa ăn'); render(); syncNow(false);
      };
      const del = $('#mDel', root);
      if (del) del.onclick = () => {
        $('#mConfirm', root).innerHTML = '<div class="confirm">Xoá bữa ăn này cùng ảnh? Không thể hoàn tác.<div class="row"><button class="btn sm danger solid" id="mDelYes">Xoá</button><button class="btn sm" id="mDelNo">Huỷ</button></div></div>';
        $('#mDelNo', root).onclick = () => ($('#mConfirm', root).innerHTML = '');
        $('#mDelYes', root).onclick = async () => { if (m.photo) await removeMedia(m.photo); D.meals = D.meals.filter((x) => x.id !== m.id); save(); closeSheet(); toast('Đã xoá'); render(); syncNow(false); };
      };
    });
  }
  function nutriTargetSheet() {
    const tg = nutriTarget();
    openSheet(`${sheetHead('Mục tiêu dinh dưỡng')}
      <p class="sub" style="margin:0">App tự ước lượng theo cân nặng (${fmt(latestWeight() || 55)} kg) và mục tiêu của bạn${goalText(D.profile) ? ' (' + esc(goalText(D.profile)) + ')' : ''}. Nếu HLV đã tính cho bạn con số riêng, nhập vào đây.</p>
      <div class="f2"><label class="f">kcal mỗi ngày<input id="nK" inputmode="numeric" value="${D.settings.nutri && D.settings.nutri.kcal ? D.settings.nutri.kcal : ''}" placeholder="${tg.kcal}"></label>
        <label class="f">Đạm (g) mỗi ngày<input id="nP" inputmode="numeric" value="${D.settings.nutri && D.settings.nutri.protein ? D.settings.nutri.protein : ''}" placeholder="${tg.protein}"></label></div>
      <button class="btn primary block" id="nSave">Lưu</button>
      <button class="btn block" id="nAuto">Dùng ước lượng tự động</button>`, (root) => {
      $('#nSave', root).onclick = () => { D.settings.nutri = { kcal: num($('#nK', root).value), protein: num($('#nP', root).value) }; save(); closeSheet(); render(); };
      $('#nAuto', root).onclick = () => { D.settings.nutri = null; save(); closeSheet(); render(); };
    });
  }
  function buildMeals() {
    const since = addDays(today(), -60);
    return D.meals.filter((m) => m.date >= since).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 200).map((m) => {

  const ROUTINES = {

  // ================= LINK TRONG GHI CHÚ: tên bài → mở hướng dẫn bài; địa chỉ web → mở trang =================
  let noteIdx = null, noteIdxKey = '';
  function noteIndex() {
    const list = allEx();
    const key = list.length + ':' + list.map((e) => e.id).join(',').length;
    if (noteIdx && noteIdxKey === key) return noteIdx;
    const map = new Map();
    for (const e of list) {
      const n = e.name || '', base = n.replace(/\s*\(.*\)\s*$/, '').trim(), inner = (n.match(/\(([^)]+)\)/) || [])[1];
      for (const v of [n, base, inner]) if (v && v.trim().length >= 5 && !map.has(v.trim().toLowerCase())) map.set(v.trim().toLowerCase(), e.id);
    }
    const names = [...map.keys()].sort((a, b) => b.length - a.length).map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    noteIdx = { map, re: names.length ? new RegExp('(?<![\\p{L}\\d])(' + names.join('|') + ')(?![\\p{L}\\d])', 'giu') : null };
    noteIdxKey = key;
    return noteIdx;
  }
  function richNote(text) {
    const t = String(text ?? '');

      const id = idx.map.get(m.toLowerCase());
      return id ? `<span class="ex-link" role="link" tabindex="0" data-act="ex-info" data-id="${esc(id)}">${m}</span>` : m;
    }) : esc(chunk));
    let out = '', last = 0;
    for (const m of t.matchAll(/\b(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi)) {
      let url = m[0].replace(/[),.;!?]+$/, '');
      out += linkEx(t.slice(last, m.index));
      const href = /^https?:/i.test(url) ? url : 'https://' + url;

      last = m.index + url.length;

    return out + linkEx(t.slice(last));

  // ================= GOM KHỞI ĐỘNG / GIÃN CƠ TĨNH (giống nhau mọi buổi) =================
  const WARM_GROUPS = { dynamic: '🔥 Khởi động', static: '🧘 Giãn cơ tĩnh' };
  const planExGroup = (e) => { const id = e.libId && LIB.some((x) => x.id === e.libId) ? e.libId : null; return id ? exById(id).group : ''; };
  function planSummary(exs, limit) {
    const warm = exs.filter((e) => planExGroup(e) === 'dynamic').length, cool = exs.filter((e) => planExGroup(e) === 'static').length;
    const main = exs.filter((e) => !WARM_GROUPS[planExGroup(e)]);
    const txt = (e) => `${e.name}${e.sets || e.reps ? ` ${e.sets || '?'}×${e.reps || '?'}${e.repsTo ? '–' + e.repsTo : ''}` : ''}${e.kg ? ` @${fmt(e.kg)}kg` : ''}`;
    const parts = [];
    if (warm) parts.push(`🔥 Khởi động ${warm} động tác`);
    parts.push(...(limit ? main.slice(0, limit) : main).map(txt));
    if (limit && main.length > limit) parts.push(`+${main.length - limit} bài`);
    if (cool) parts.push(`🧘 Giãn cơ ${cool} động tác`);
    return parts.join(' · ');
  }
  function foldWorkout(cards) {
    const g = A.items.map((it) => exById(it.ex).group);
    if (g.every((x) => WARM_GROUPS[x])) return cards.join('');
    let out = '', i = 0;
    while (i < cards.length) {
      if (!WARM_GROUPS[g[i]]) { out += cards[i++]; continue; }
      let j = i; while (j < cards.length && g[j] === g[i]) j++;
      if (j - i < 2) { out += cards.slice(i, j).join(''); i = j; continue; }
      const its = A.items.slice(i, j), done = its.filter((it) => it.sets.length && it.sets.every((x) => x.done)).length, key = 'grp-' + g[i] + '-' + i;
      out += `<details class="wgroup" data-tip="${key}" ${S.openTips.has(key) ? 'open' : ''}><summary><span>${WARM_GROUPS[g[i]]} · ${j - i} động tác</span><span class="chip ${done === j - i ? 'good' : ''}">${done}/${j - i} xong</span></summary><div class="wg-in">${cards.slice(i, j).join('')}</div></details>`;
      i = j;
    }

  }

  // ================= ẢNH/VIDEO HLV GỬI (lưu vào điện thoại) =================
  async function fetchCoachMedia() {

        const parts = [];
        for (let i = 0; i < m.chunks; i++) parts.push((await api('coach-media-get', { ...auth, id: m.id, idx: i })).data);
        const bin = atob(parts.join('')), u = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        await MDB.put('cm-' + m.id, new Blob([u], { type: m.mime || (m.kind === 'video' ? 'video/mp4' : 'image/jpeg') }));
        have[m.id] = true; save();
      } catch (e) { if (e.status === 404) { have[m.id] = 'gone'; save(); } else return; }
    }
  }
  function coachTiles(list) {
    const all = (list || []).filter((m) => m && m.id), ok = all.filter((m) => (D.coachMediaHave || {})[m.id] === true);

  // ================= SYNC WITH COACH (Sổ HLV) =================
  const SYNC_URL = /(^|\.)camgym\.vercel\.app$|^localhost$|^127\.0\.0\.1$/.test(location.hostname) ? '/api/sync' : 'https://camgym.vercel.app/api/sync';
  const randKey = () => [...crypto.getRandomValues(new Uint8Array(24))].map((b) => b.toString(16).padStart(2, '0')).join('');
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, ' ').trim();
  const ALIASES = {
    'back squat': 'back-squat', 'squat': 'back-squat', 'bench press': 'bench', 'day nguc': 'bench', 'deadlift': 'deadlift', 'romanian deadlift': 'rdl-db', 'rdl': 'rdl-db',
    'leg press': 'leg-press', 'lat pulldown': 'lat-pulldown', 'keo xo': 'lat-pulldown', 'seated row': 'cable-row', 'shoulder press': 'db-press', 'day vai': 'db-press',
    'plank': 'plank', 'chay bo': 'incline-walk', 'di bo': 'incline-walk', 'hip thrust': 'hip-thrust', 'lunge': 'db-lunge', 'push up': 'pushup', 'hit dat': 'pushup', 'chong day': 'pushup',
    'bicep curl': 'db-curl', 'biceps curl': 'db-curl', 'leg curl': 'leg-curl', 'leg extension': 'leg-ext', 'goblet squat': 'goblet-squat', 'face pull': 'face-pull', 'dap xe': 'bike',

    if (hit) return hit.id;
    const ex = { id: 'x' + n.replace(/ /g, '-').slice(0, 40), custom: true, fromCoach: true, name: String(name).trim(), group: type === 'min' || type === 'time' ? 'cardio' : 'other', type: ['weight', 'reps', 'time', 'min'].includes(type) ? type : 'weight', inc: type === 'min' ? 0 : 2.5, equip: '', steps: [], mistakes: [] };

          <div class="row"><button class="btn sm primary" id="lSync">Đồng bộ ngay</button></div></div>
        <p class="sub" style="margin:0">HLV đổi mã hoặc bạn đổi điện thoại? Nhập mã mới bên dưới.</p>` : `
        <ol class="steps"><li>Nhờ HLV mở <b>Sổ HLV</b> → học viên (bạn) → tab <b>Hồ sơ</b> → <b>Tạo mã kết nối</b>.</li><li>Nhập mã 8 ký tự HLV gửi (VD: K7QP-3XMA).</li></ol>`}
      <label class="f">Mã kết nối<input id="lCode" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="VD: K7QP-3XMA" style="text-transform:uppercase;letter-spacing:.12em;font-weight:700"></label>
      <button class="btn ${L ? '' : 'primary'} block" id="lGo">${L ? 'Kết nối bằng mã mới' : 'Kết nối'}</button>
      <div class="sub">Khi kết nối, hồ sơ, cân nặng và các buổi tập của bạn được gửi lên máy chủ đồng bộ để HLV xem. HLV gửi bài tập về app của bạn.</div>
      ${L ? '<button class="btn danger block" id="lOff">Ngắt kết nối với HLV</button><div id="lConfirm"></div>' : ''}`, (root) => {
      $('#lGo', root).onclick = async (e) => {
        const code = $('#lCode', root).value.trim();
        if (code.replace(/[^a-z0-9]/gi, '').length !== 8) { toast('Mã gồm 8 ký tự, ví dụ K7QP-3XMA.'); return; }
        e.target.disabled = true; e.target.textContent = 'Đang kết nối…';
        try {
          const traineeKey = randKey();
          const j = await api('claim', { code, traineeKey });
          D.link = { pairId: j.pairId, traineeKey, coachName: j.coachName, clientName: j.clientName, linkedAt: new Date().toISOString(), lastSync: null, error: null };
          save(); closeSheet(); toast(`Đã kết nối với HLV ${j.coachName || ''}`);
          await syncNow(false); render();
        } catch (err) { toast(err.message); e.target.disabled = false; e.target.textContent = L ? 'Kết nối bằng mã mới' : 'Kết nối'; }
      };
      const sy = $('#lSync', root); if (sy) sy.onclick = async () => { await syncNow(true); closeSheet(); };
      const off = $('#lOff', root);
      if (off) off.onclick = () => {
        $('#lConfirm', root).innerHTML = `<div class="confirm">Ngắt kết nối? HLV sẽ không nhận được buổi tập mới của bạn và bài HLV giao sẽ ẩn khỏi app. Dữ liệu tập trên máy vẫn giữ nguyên.<div class="row"><button class="btn sm danger solid" id="lOffYes">Ngắt kết nối</button><button class="btn sm" id="lOffNo">Huỷ</button></div></div>`;
        $('#lOffNo', root).onclick = () => ($('#lConfirm', root).innerHTML = '');
        $('#lOffYes', root).onclick = async () => {
          try { await api('unlink', { pairId: D.link.pairId, traineeKey: D.link.traineeKey }); } catch { /* vẫn ngắt trên máy */ }
          D.link = null; D.coachPlans = []; D.coachTips = null; D.feedback = {}; save(); closeSheet(); toast('Đã ngắt kết nối với HLV'); render();
        };
      };
    });
  }

  function doExport() {
    const blob = new Blob([JSON.stringify({ app: 'nhat-ky-tap', version: 1, exportedAt: new Date().toISOString(), data: D }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `nhat-ky-tap-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    D.settings.lastBackup = new Date().toISOString(); save();
    toast('Đã tạo tệp sao lưu. Nhớ gửi tệp lên Zalo/Drive.');
    if (S.view === 'home') render();
  }

  // ================= SETTINGS / BACKUP =================
  function settingsSheet() {
    openSheet(`${sheetHead('Cài đặt & sao lưu')}
      <div class="row"><button class="btn sm" data-act="profile">Hồ sơ của tôi</button><button class="btn sm" data-act="help">Hướng dẫn sử dụng</button></div>
      <section><h3>Giáo án đang theo</h3>
        <div class="list">${PROGRAMS.map((p) => `<button class="pick" type="button" data-prog="${p.id}" aria-pressed="${D.program.id === p.id}"><span class="box">${D.program.id === p.id ? '✓' : ''}</span><span class="grow"><b>${esc(p.name)}</b><br><span class="sub">${esc(p.desc)}</span></span></button>`).join('')}</div></section>
      <section><h3>Thời gian nghỉ giữa hiệp</h3>
        <div class="seg" id="restSeg">${[60, 90, 120, 180].map((s) => `<button type="button" data-s="${s}" aria-pressed="${D.settings.rest === s}">${s}s</button>`).join('')}</div></section>
      <section><h3>Sao lưu</h3>
        <p class="sub" style="margin:0">Dữ liệu nằm trong trình duyệt của điện thoại này. Tải tệp sao lưu mỗi tuần và cất lên Drive/Zalo để không mất khi đổi máy.
          ${D.settings.lastBackup ? `Lần sao lưu gần nhất: ${esc(new Date(D.settings.lastBackup).toLocaleDateString('vi-VN'))}.` : 'Bạn chưa sao lưu lần nào.'}
          <button class="btn sm ghost" data-act="help" data-sec="backup">Xem cách sao lưu</button></p>
        <div class="row"><button class="btn sm" id="bExport">Tải tệp sao lưu</button><label class="btn sm" style="position:relative;overflow:hidden">Khôi phục từ tệp<input id="bImport" type="file" accept="application/json,.json" style="position:absolute;inset:0;opacity:0"></label></div></section>
      <section><h3>Xoá toàn bộ dữ liệu</h3><button class="btn danger" id="bWipe">Xoá hết nhật ký</button><div id="bConfirm"></div></section>
      <p class="sub" style="margin:0">Phiên bản ${APP_VERSION} · PT ${esc(D.settings.ptName || DEFAULT_PT)}</p>`, (root) => {
      root.addEventListener('click', (e) => {
        const p = e.target.closest('[data-prog]');
        if (p && p.dataset.prog !== D.program.id) { D.program = { id: p.dataset.prog, next: 0 }; save(); settingsSheet(); render(); toast('Đã đổi giáo án'); }
        const r = e.target.closest('#restSeg [data-s]');
        if (r) { D.settings.rest = Number(r.dataset.s); save(); $$('#restSeg button', root).forEach((x) => x.setAttribute('aria-pressed', String(x === r))); }
      });
      $('#bExport', root).onclick = () => doExport();
      $('#bImport', root).onchange = async (e) => {
        const file = e.target.files[0]; if (!file) return;
        try {
          const j = JSON.parse(await file.text());
          if (j.app !== 'nhat-ky-tap' || !j.data) throw new Error('bad');
          const merge = (a, b) => { const m = new Map(a.map((x) => [x.id, x])); b.forEach((x) => m.set(x.id, x)); return [...m.values()]; };
          D.workouts = merge(D.workouts, j.data.workouts || []); D.pt = merge(D.pt, j.data.pt || []);
          D.journal = merge(D.journal, j.data.journal || []); D.custom = merge(D.custom, j.data.custom || []);
          if (j.data.profile && !D.profile.name) D.profile = Object.assign(blank().profile, j.data.profile);
          if (j.data.settings && j.data.settings.ptName) D.settings.ptName = j.data.settings.ptName;
          D.settings.onboarded = true;
          save(); closeSheet(); toast('Đã khôi phục dữ liệu'); render();
        } catch { toast('Tệp không hợp lệ. Hãy chọn tệp sao lưu của Nhật Ký Tập.'); }
      };
      $('#bWipe', root).onclick = () => {
        $('#bConfirm', root).innerHTML = `<div class="confirm">Xoá toàn bộ buổi tập, bài PT, ghi chú và bài riêng trên máy này? Không thể hoàn tác (trừ khi bạn có tệp sao lưu).<div class="row"><button class="btn sm danger solid" id="bWipeYes">Xoá hết</button><button class="btn sm" id="bWipeNo">Huỷ</button></div></div>`;
        $('#bWipeNo', root).onclick = () => ($('#bConfirm', root).innerHTML = '');
        $('#bWipeYes', root).onclick = () => { D = blank(); A = null; save(); saveActive(true); closeSheet(); toast('Đã xoá dữ liệu'); go('home'); };
      };
    });
  }
  function programSheet() {
    const p = PROGRAMS.find((x) => x.id === D.program.id) || PROGRAMS[0];
    openSheet(`${sheetHead(p.name)}
      <div class="row"><span class="chip accent">${esc(p.place)}</span><span class="chip">${p.weeks} tuần</span></div>
      <p style="margin:0">${esc(p.desc)}</p>
      <div class="hint">Tăng dần: khi làm đủ số lần ở mọi hiệp với đúng kỹ thuật, buổi sau app sẽ gợi ý tăng tạ (hoặc tăng lần/giây). Không đủ thì giữ nguyên mức cũ.</div>
      ${p.days.map((d, i) => `<section><div class="row between"><h3>${esc(d.name)}${i === D.program.next % p.days.length ? ' <span class="chip accent">buổi tới</span>' : ''}</h3>
        <button class="btn sm" data-day="${i}">Tập buổi này</button></div>
        <div class="list">${d.items.map(([id, s, r]) => { const e = exById(id); return `<button class="card" data-act="ex-info" data-id="${esc(id)}" style="padding:10px 12px"><div class="row between"><span>${esc(e.name)}</span><span class="muted small num">${targetText(e.type, s, r)}</span></div></button>`; }).join('')}</div></section>`).join('')}
      <button class="btn block" data-act="settings">Đổi giáo án khác</button>`, (root) => {
      root.addEventListener('click', (e) => { const b = e.target.closest('[data-day]'); if (!b) return; closeSheet(); startProgramDay(Number(b.dataset.day)); });
    });
  }
  function startProgramDay(i) {
    const p = PROGRAMS.find((x) => x.id === D.program.id) || PROGRAMS[0];
    const d = p.days[i];
    startWorkout(`${d.name} · ${p.place}`, d.items.map(([ex, sets, reps]) => ({ ex, sets, reps })), { type: 'program', programId: p.id, day: i });
  }

  // ================= events =================
  document.addEventListener('change', async (e) => {
    const inp = e.target;
    if (!inp || !inp.dataset || !inp.dataset.mediaRef) return;
    const [type, refId] = inp.dataset.mediaRef.split(':');
    const files = [...inp.files]; inp.value = '';
    let n = 0;
    for (const f of files) if (await addMedia(f, { type, id: refId })) n += 1;
    if (!n) return;
    toast(D.link ? `Đã lưu ${n} tệp, đang gửi HLV…` : `Đã lưu ${n} tệp`);
    if (S.view === 'workout') render();
    else { const w = D.workouts.find((x) => x.id === refId); if (w) { closeSheet(); workoutSheet(w); } }
    if (D.link && S.view !== 'workout') syncNow(false);
  });
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    const id = el.dataset.id;
    switch (a) {
      case 'nav': go(el.dataset.to); break;
      case 'close-sheet': closeSheet(); break;
      case 'close-picker': closePicker(); break;
      case 'settings': closeSheet(); settingsSheet(); break;
      case 'program-info': programSheet(); break;
      case 'guide': closeSheet(); guideSheet(); break;
      case 'profile': closeSheet(); profileSheet(false); break;
      case 'help': closeSheet(); helpSheet(el.dataset.sec); break;
      case 'backup-now': doExport(); break;
      case 'link': closeSheet(); linkSheet(); break;
      case 'routine': startRoutine(id); break;
      case 'food-day': { const base = S.foodDate || today(); const nd = addDays(base, Number(el.dataset.d)); if (nd <= today()) { S.foodDate = nd; render(); } break; }
      case 'meal-new': mealSheet(null, null); break;
      case 'meal-edit': { const m = D.meals.find((x) => x.id === id); if (m) mealSheet(m, null); break; }
      case 'nutri-target': nutriTargetSheet(); break;
      case 'media-del': e.stopPropagation(); removeMedia(id).then(() => { if (S.view === 'workout') render(); else { const w = D.workouts.find((x) => x.id === el.dataset.w); closeSheet(); if (w) workoutSheet(w); } }); break;
      case 'sync': syncNow(true); break;
      case 'plan-start': { const p = (D.coachPlans || []).find((x) => x.id === id); if (p) startCoachPlan(p); break; }
      case 'start-program': startProgramDay(D.program.next % (PROGRAMS.find((x) => x.id === D.program.id) || PROGRAMS[0]).days.length); break;
      case 'start-free': startWorkout(`Buổi tự chọn ${fmtShort(today())}`, [], { type: 'free' }); setTimeout(() => A && !A.items.length && $('[data-act=add-ex]') && $('[data-act=add-ex]').click(), 50); break;
      case 'pt-new': ptSheet(null); break;
      case 'pt-edit': ptSheet(D.pt.find((p) => p.id === id)); break;
      case 'pt-start': { const p = D.pt.find((x) => x.id === id); if (p) startPt(p); break; }
      case 'ext': break;
      case 'cm-view': openSheet(`${sheetHead('Ảnh HLV gửi')}<img src="${mediaSrc(id)}" alt="" style="width:100%;border-radius:14px">`); break; // link web: để trình duyệt mở
      case 'ex-info': e.stopPropagation(); exInfoSheet(id); break;
      case 'lib-group': S.libGroup = el.dataset.g; render(); break;
      case 'custom-new': customSheet(); break;
      case 'log-filter': S.logFilter = el.dataset.f; render(); break;
      case 'w-open': { const w = D.workouts.find((x) => x.id === id); if (w) workoutSheet(w); break; }
      case 'journal-new': journalSheet(null); break;
      case 'journal-edit': journalSheet(D.journal.find((x) => x.id === id)); break;
      // workout
      case 'pause': setPaused(!A.pausedAt); break;
      case 'toggle-set': {
        if (A.pausedAt) setPaused(false);
        const it = A.items[Number(el.dataset.i)], s = it.sets[Number(el.dataset.s)];
        const ex = exById(it.ex);
        if (!s.done && s.reps == null) { toast('Nhập số ' + unit(ex.type) + ' trước khi tick.'); break; }
        if (!s.done && ex.type === 'weight' && s.kg == null) { toast('Nhập mức tạ (kg) trước khi tick. Tập không tạ thì ghi 0.'); break; }
        s.done = !s.done;
        if (s.done) {
          const nx = it.sets[Number(el.dataset.s) + 1];
          if (nx && !nx.done) { if (nx.kg == null) nx.kg = s.kg; if (nx.reps == null) nx.reps = s.reps; }
          startRest(it.rest || D.settings.rest);
        }
        saveActive(); render(); break;
      }
      case 'add-set': { const it = A.items[Number(el.dataset.i)]; const l = it.sets[it.sets.length - 1] || {}; it.sets.push({ kg: l.kg ?? null, reps: l.reps ?? it.target.reps, done: false }); saveActive(); render(); break; }
      case 'rm-set': { const it = A.items[Number(el.dataset.i)]; if (it.sets.length > 1) it.sets.pop(); saveActive(); render(); break; }
      case 'rm-ex': A.items.splice(Number(el.dataset.i), 1); saveActive(); render(); break;
      case 'add-ex': openPicker({ title: 'Thêm bài vào buổi', multi: true, onDone: (ids) => { ids.forEach((x) => { const ex = exById(x); A.items.push(buildItem({ ex: x, sets: ex.type === 'min' ? 1 : 3, reps: ex.type === 'time' ? 30 : ex.type === 'min' ? 10 : 10 })); }); saveActive(); render(); } }); break;
      case 'rest-add': if (rest) { rest.end += Number(el.dataset.s) * 1000; rest.total = Math.max(rest.total, (rest.end - Date.now()) / 1000); rest.fired = false; } tick(); break;
      case 'rest-skip': rest = null; tick(); break;
      case 'finish': finishSheet(); break;
      case 'cancel-workout':
        $('#cancelBox').innerHTML = `<div class="confirm">Huỷ buổi này? Các hiệp đã ghi sẽ không được lưu.<div class="row"><button class="btn sm danger solid" id="cYes">Huỷ buổi</button><button class="btn sm" id="cNo">Tập tiếp</button></div></div>`;
        $('#cNo').onclick = () => ($('#cancelBox').innerHTML = '');
        $('#cYes').onclick = () => { A = null; rest = null; saveActive(true); toast('Đã huỷ buổi tập'); go('home'); };
        break;
    }
  });
  $('#backBtn').addEventListener('click', () => history.back());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('#picker').hidden) closePicker(); else if (!$('#sheet').hidden) closeSheet(); } });

  render();
  if (!D.settings.onboarded && !D.profile.name && S.view === 'home') profileSheet(true);
  if (D.link) syncNow(false);
})();
</script>
