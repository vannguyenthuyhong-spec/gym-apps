  function newSessionFor(clientId, fromPrev) {
    const base = { id: uid('s'), clientId: clientId || '', date: today(), title: '', exercises: [], status: 'planned', rating: null, note: '', media: [] };
    if (fromPrev) {
      const prev = sessionsOf(clientId).filter((s) => (s.exercises || []).length).sort((a, b) => b.date.localeCompare(a.date))[0];
      if (prev) {
        base.title = prev.title;
        base.exercises = prev.exercises.map((e) => ({ ...e, done: false }));
      }
    }
    // danh sách trống: HLV chọn từ thư viện, dán giáo án hoặc tự nhập
    return base;
  }

  function sessionSheet(sess) {
    const isNew = !S.sessions.some((s) => s.id === sess.id);
    const f = JSON.parse(JSON.stringify(sess));
    f.media = f.media || []; f.exercises = f.exercises || [];
    const names = [...new Set(S.sessions.flatMap((s) => (s.exercises || []).map((e) => e.name)).filter(Boolean))].slice(0, 200);
    const clients = activeClients();
    const c = clientById(f.clientId);

    openSheet(`
      <div class="sheet-head"><h2>${isNew ? 'Buổi tập mới' : (sessionNo(sess) ? 'Buổi ' + sessionNo(sess) : 'Buổi tập')}</h2><button class="icon-btn" data-act="close-sheet" aria-label="Đóng">×</button></div>
      <form id="sForm" class="list" novalidate>
        ${!f.clientId || isNew && !c ? `<label class="f">Học viên<select id="sClient"><option value="">Chọn học viên…</option>${clients.map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></label>`
          : `<div class="muted small">Học viên: <b style="color:var(--ink)">${esc(c ? c.name : '')}</b></div>`}
        <div class="f2">
          <label class="f">Ngày<input id="sDate" type="date" value="${esc(f.date)}"></label>
          <label class="f">Tên buổi<input id="sTitle" maxlength="80" placeholder="VD: Chân + core" value="${esc(f.title)}"></label>
        </div>
        <div class="seg" role="group" aria-label="Trạng thái">
          ${Object.entries(STATUS).map(([k, l]) => `<button type="button" data-status="${k}" aria-pressed="${f.status === k}">${l}</button>`).join('')}
        </div>
        <section><div class="row between"><h2>Bài tập</h2><span class="muted small" id="exCount"></span></div>
          <div class="ex-tools">
            <button class="btn" type="button" id="libOpen" aria-expanded="false">Chọn từ thư viện</button>
            <button class="btn" type="button" id="pasteOpen" aria-expanded="false">Dán giáo án</button>
          </div>
          <div class="tool-panel" id="libPanel" hidden>
            <div class="row" style="flex-wrap:nowrap"><input class="q" id="libQ" type="search" placeholder="Tìm bài: squat, mông, kéo xô…" aria-label="Tìm bài tập" autocomplete="off"><button class="btn small" type="button" id="libDone">Xong</button></div>
            <div class="chips" id="libChips" role="group" aria-label="Nhóm cơ"></div>
            <div class="lib-list" id="libList"></div>
          </div>
          <div class="tool-panel" id="pastePanel" hidden>
            <label class="muted small" for="pasteText">Dán giáo án từ tin nhắn. Mỗi bài một dòng, VD: <i>Hip Thrust — 3 set × 12 reps 10kg (nghỉ 2-3')</i></label>
            <textarea id="pasteText" placeholder="Ngày 1: Mông + Đùi&#10;Khởi động: 7–10 phút&#10;1. Hip Thrust — 3 set × 12 reps 10kg (nghỉ 2-3')&#10;2. Bulgarian Split Squat — 2 set × 10 reps mỗi chân 4kg&#10;Cardio: đi bộ dốc 10'"></textarea>
            <div class="row"><button class="btn primary" type="button" id="pasteGo">Tách thành bài tập</button><button class="btn" type="button" id="pasteClose">Đóng</button></div>
          </div>
          <div class="ex-list" id="exList"></div>
          <button class="btn block" type="button" id="exAdd">+ Bài tự nhập</button>
        </section>
        <datalist id="exNames">${[...new Set([...names, ...EX_LIB.map((x) => x.name)])].map((n) => `<option value="${esc(n)}"></option>`).join('')}</datalist>
        <section><h2>Đánh giá buổi tập</h2>
          <div class="rating" role="group" aria-label="Đánh giá 1 đến 5">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-rate="${n}" aria-pressed="${f.rating === n}">${n}</button>`).join('')}</div>
        </section>
        <label class="f">Ghi chú của HLV (kỹ thuật, cảm giác, điều chỉnh buổi sau)<textarea id="sNote" maxlength="3000">${esc(f.note)}</textarea></label>
        ${f.result ? `<section><h2>Học viên đã ghi trên app</h2><div class="card">
          ${(f.result.items || []).map((i) => `<div><b>${esc(i.name)}</b><div class="card-sub num">${(i.sets || []).map((s) => (i.type === 'weight' ? `${fmtNum(s.kg)} kg × ${s.reps ?? '?'}` : `${s.reps ?? '?'}${i.type === 'time' ? ' giây' : i.type === 'min' ? ' phút' : ' lần'}`)).join(' · ')}</div>${i.note ? `<div class="card-sub">${esc(i.note)}</div>` : ''}</div>`).join('')}
          <div class="card-sub">${[f.result.minutes ? f.result.minutes + ' phút' : '', f.result.feeling ? 'cảm giác ' + f.result.feeling + '/5' : ''].filter(Boolean).join(' · ')}</div>
          ${f.result.note ? `<div style="white-space:pre-wrap;overflow-wrap:anywhere"><span class="muted small">Nhật ký học viên:</span> ${esc(f.result.note)}</div>` : ''}
        </div>
        ${c && c.link ? `<label class="f">Nhận xét gửi học viên (hiện trên app học viên, dưới buổi tập này)<textarea id="sFb" maxlength="300" style="min-height:64px">${esc((c.feedback || {})[f.result.wid] || '')}</textarea></label>` : ''}</section>` : ''}
        <section><div class="row between"><h2>Ảnh & video</h2><span class="muted small" id="upState"></span></div>
          <div class="grid" id="mediaGrid"></div>
          ${S.assets ? `<label class="btn block file-btn">+ Thêm ảnh/video<input id="sFiles" type="file" accept="image/*,video/*" multiple></label>
            <p class="muted small" style="margin:0">Ảnh được nén còn khoảng 1600px. Video giữ nguyên chất lượng; chỉ khi gửi cho học viên mà video trên 18 MB thì app nén một bản sao để gửi (giữ màn hình mở lúc đồng bộ).</p>`
            : '<p class="muted small" style="margin:0">Chỉ chủ sổ hoặc người có quyền sửa mới tải được ảnh/video.</p>'}
        </section>
        ${f.fromTrainee ? '' : (() => { const c2 = clientById(f.clientId); return `<section><h2>Gửi sang app học viên</h2>
          <label class="tick"><input type="checkbox" id="sSend" ${f.sendApp !== false ? 'checked' : ''}> Gửi giáo án buổi này cho học viên</label>
          <label class="tick"><input type="checkbox" id="sShare" ${f.shareMedia ? 'checked' : ''}> Cho học viên xem ảnh/video của buổi này</label>
          <p class="muted small" style="margin:0">${c2 && c2.link ? 'Khi đồng bộ, buổi đã tích sẽ hiện trong buổi tập của học viên (kèm ảnh/video nếu tích ô thứ hai).' : 'Học viên chưa nối app: vào học viên → Hồ sơ → Tạo mã kết nối.'}</p></section>`; })()}
        <button class="btn primary block" type="submit" id="sSave">Lưu buổi tập</button>
        ${!isNew ? '<button class="btn danger block" type="button" id="sDelete">Xoá buổi tập</button><div id="sConfirm"></div>' : ''}
      </form>`, (root) => {
      let uploading = false;
      const exList = $('#exList', root);
      const syncEx = () => {
        f.exercises = $$('.ex-row', exList).map((r, i) => {
          const old = f.exercises[i] || {};
          const name = $('[data-k=name]', r).value.trim();
          const lib = matchLib(name);
          const rp = parseReps($('[data-k=reps]', r).value);
          const restText = $('[data-k=rest]', r).value.trim();
          return {
            name, libId: lib ? lib.id : null, type: lib ? lib.type : (old.type || 'weight'),
            sets: num($('[data-k=sets]', r).value), reps: rp.reps, repsTo: rp.repsTo, kg: num($('[data-k=kg]', r).value),
            restText, rest: restSeconds(restText), note: $('[data-k=note]', r).value.trim(), done: $('[data-k=done]', r).checked,
          };
        });
      };
      const drawEx = () => {
        const n = f.exercises.filter((x) => x.name).length;
        $('#exCount', root).textContent = n ? n + ' bài' : '';
        const rows = f.exercises.map((e, i) => {
          const t = exTypeOf(e), lib = e.libId ? libById(e.libId) : matchLib(e.name);
          return `
          <div class="ex-row">
            <div class="name"><input id="exName${i}" data-k="name" list="exNames" placeholder="Tên bài (VD: Squat)" value="${esc(e.name)}" aria-label="Tên bài ${i + 1}">
              <button class="rm" type="button" data-rm="${i}" aria-label="Xoá bài ${i + 1}">×</button></div>
            ${e.name ? `<div class="ex-tag">${lib ? `<b>✓</b> ${esc(EX_GROUPS[lib.group])}${fold(lib.name) !== fold(e.name) ? ' · app học viên: ' + esc(lib.name) : ''}` : 'Bài riêng (app học viên sẽ thêm bài mới)'}</div>` : ''}
            <label class="mini">Hiệp<input id="exSets${i}" data-k="sets" inputmode="numeric" value="${e.sets ?? ''}"></label>
            <label class="mini">${t === 'min' ? 'Phút' : t === 'time' ? 'Giây' : 'Lần'}<input id="exReps${i}" data-k="reps" value="${e.reps ?? ''}${e.repsTo ? '-' + e.repsTo : ''}" placeholder="12 / 15-20"></label>
            <label class="mini">Kg<input id="exKg${i}" data-k="kg" inputmode="decimal" value="${e.kg ?? ''}"></label>
            <div class="ex-more">
              <label class="mini">Nghỉ<input id="exRest${i}" data-k="rest" value="${esc(e.restText || '')}" placeholder="VD 90s"></label>
              <label class="mini note">Lưu ý bài<input id="exNote${i}" data-k="note" maxlength="200" value="${esc(e.note || '')}" placeholder="VD: mỗi chân, ngồi thẳng"></label>
            </div>
            <label class="tick"><input id="exDone${i}" data-k="done" type="checkbox" ${e.done ? 'checked' : ''}> Đã hoàn thành</label>
          </div>`;
        });
        const gOf = (e) => { const lib = e.name && (e.libId ? libById(e.libId) : matchLib(e.name)); return lib && WARM_G[lib.group] ? lib.group : ''; };
        const g = f.exercises.map(gOf);
        let html = '', i = 0;
        while (i < rows.length) {
          if (!g[i]) { html += rows[i++]; continue; }
          let j = i; while (j < rows.length && g[j] === g[i]) j++;
          if (j - i < 2) { html += rows.slice(i, j).join(''); i = j; continue; }
          const key = g[i] + i;
          html += `<details class="ex-group" data-g="${key}" ${openGroups.has(key) ? 'open' : ''}><summary>${WARM_G[g[i]]} · ${j - i} động tác</summary><div class="ex-list">${rows.slice(i, j).join('')}</div></details>`;
          i = j;
        }
        exList.innerHTML = html;
      };
      const openGroups = new Set();
      exList.addEventListener('toggle', (ev) => { const d = ev.target; if (d.matches && d.matches('details.ex-group')) d.open ? openGroups.add(d.dataset.g) : openGroups.delete(d.dataset.g); }, true);
      // --- chọn từ thư viện ---
      const client = () => clientById(($('#sClient', root) && $('#sClient', root).value) || f.clientId);
      const lastKgFor = (lib) => {
        const c = client(); if (!c) return null;
        const hit = sessionsOf(c.id).slice().sort((a, b) => b.date.localeCompare(a.date))
          .flatMap((x) => x.exercises || []).find((x) => x.kg && (x.libId === lib.id || fold(x.name) === fold(lib.name)));
        return hit ? hit.kg : null;
      };
      let libGroup = 'all';
      const usedLib = () => new Set(f.exercises.map((x) => x.libId || (matchLib(x.name) || {}).id).filter(Boolean));
      const recentIds = () => {
        const c = client(); if (!c) return [];
        const cnt = new Map();
        for (const x of sessionsOf(c.id)) for (const e of x.exercises || []) { const l = e.libId || (matchLib(e.name) || {}).id; if (l) cnt.set(l, (cnt.get(l) || 0) + 1); }
        return [...cnt.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => id);
      };
      const drawLib = () => {
        const rec = recentIds();
        const groups = [['all', 'Tất cả'], ...(rec.length ? [['recent', 'Đã tập']] : []), ...Object.entries(EX_GROUPS)];
        $('#libChips', root).innerHTML = groups.map(([k, l]) => `<button type="button" data-g="${k}" aria-pressed="${libGroup === k}">${esc(l)}</button>`).join('');
        const q = fold($('#libQ', root).value);
        let list = libGroup === 'recent' ? rec.map(libById).filter(Boolean) : EX_LIB.filter((x) => libGroup === 'all' || x.group === libGroup);
        if (q) list = EX_LIB.filter((x) => fold(x.name).includes(q) || x.keys.some((k) => k.includes(q)) || fold(EX_GROUPS[x.group]).includes(q));
        const used = usedLib();
        $('#libList', root).innerHTML = list.length ? list.map((x) => {
          const on = used.has(x.id);
          return `<button type="button" class="lib-item" data-lib="${x.id}" aria-pressed="${on}"><span>${esc(x.name)}<span class="g">${esc(EX_GROUPS[x.group])}${x.type === 'min' ? ' · tính phút' : x.type === 'time' ? ' · tính giây' : x.type === 'reps' ? ' · không tạ' : ''}</span></span><span class="add">${on ? '✓ Đã thêm' : '+ Thêm'}</span></button>`;
        }).join('') : '<p class="muted small" style="margin:0">Không thấy bài này. Bấm "+ Bài tự nhập" để gõ tên bài riêng.</p>';
      };
      const togglePanel = (which, open) => {
        const lib = which === 'lib';
        const panel = $(lib ? '#libPanel' : '#pastePanel', root), btn = $(lib ? '#libOpen' : '#pasteOpen', root);
        panel.hidden = !open; btn.setAttribute('aria-expanded', String(open));
        if (open) { togglePanel(lib ? 'paste' : 'lib', false); if (lib) drawLib(); }
      };
      $('#libOpen', root).onclick = () => togglePanel('lib', $('#libPanel', root).hidden);
      $('#libDone', root).onclick = () => togglePanel('lib', false);
      $('#libQ', root).addEventListener('input', drawLib);
      $('#libChips', root).onclick = (e) => { const b = e.target.closest('[data-g]'); if (!b) return; libGroup = b.dataset.g; $('#libQ', root).value = ''; drawLib(); };
      $('#libList', root).onclick = (e) => {
        const b = e.target.closest('[data-lib]'); if (!b) return;
        const lib = libById(b.dataset.lib);
        syncEx();
        const at = f.exercises.findIndex((x) => (x.libId || (matchLib(x.name) || {}).id) === lib.id);
        if (at >= 0) f.exercises.splice(at, 1);
        else {
          f.exercises = f.exercises.filter((x) => x.name);
          f.exercises.push({ name: lib.name, libId: lib.id, type: lib.type, sets: lib.type === 'min' ? 1 : 3, reps: lib.type === 'min' ? 10 : lib.type === 'time' ? 30 : 12, repsTo: null,
            kg: lib.type === 'weight' ? lastKgFor(lib) : null, rest: null, restText: '', note: '', done: false });
        }
        drawEx(); drawLib();
      };
      // --- dán giáo án ---
      $('#pasteOpen', root).onclick = () => { const open = $('#pastePanel', root).hidden; togglePanel('paste', open); if (open) $('#pasteText', root).focus(); };
      $('#pasteClose', root).onclick = () => togglePanel('paste', false);
      $('#pasteGo', root).onclick = () => {
        const r = parsePlanText($('#pasteText', root).value);
        if (!r.exercises.length) { toast('Không tách được bài nào. Mỗi bài nên nằm một dòng, kèm số hiệp × số lần.'); return; }
        syncEx();
        f.exercises = [...f.exercises.filter((x) => x.name), ...r.exercises];
        const title = $('#sTitle', root);
        if (r.title && !title.value.trim()) title.value = r.title;
        if (r.notes.length) { const n = $('#sNote', root); n.value = [n.value.trim(), ...r.notes].filter(Boolean).join('\n'); }
        drawEx(); togglePanel('paste', false); $('#pasteText', root).value = '';
        const unknown = r.exercises.filter((x) => !x.libId).length;
        toast(`Đã thêm ${r.exercises.length} bài${unknown ? ` (${unknown} bài riêng)` : ''}. Kiểm tra lại số liệu.`);
      };
      const drawMedia = () => {
        $('#mediaGrid', root).innerHTML = f.media.map((m, i) => `<div style="position:relative">${mediaThumb(m, { caption: m.fromTrainee ? 'Học viên gửi' : '' })}${S.assets ? `<button class="x" type="button" data-rm-media="${i}" aria-label="Bỏ tệp" style="position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff">×</button>` : ''}</div>`).join('');
      };
      drawEx(); drawMedia();

      root.addEventListener('click', (e) => {
        const st = e.target.closest('[data-status]');
        if (st) {
          f.status = st.dataset.status;
          $$('[data-status]', root).forEach((b) => b.setAttribute('aria-pressed', String(b === st)));
          if (f.status === 'done') { syncEx(); if (!f.exercises.some((x) => x.done)) { f.exercises.forEach((x) => { if (x.name) x.done = true; }); drawEx(); } }
          return;
        }
        const rt = e.target.closest('[data-rate]');
        if (rt) {
          const n = Number(rt.dataset.rate); f.rating = f.rating === n ? null : n;
          $$('[data-rate]', root).forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.rate) === f.rating)));
          return;
        }
        const rm = e.target.closest('[data-rm]');
        if (rm) { syncEx(); f.exercises.splice(Number(rm.dataset.rm), 1); drawEx(); return; }
        const rmm = e.target.closest('[data-rm-media]');
        if (rmm) { e.stopPropagation(); f.media.splice(Number(rmm.dataset.rmMedia), 1); drawMedia(); }
      });
      $('#exAdd', root).addEventListener('click', () => {
        syncEx(); f.exercises.push({ name: '', libId: null, type: 'weight', sets: null, reps: null, repsTo: null, kg: null, rest: null, restText: '', note: '', done: false }); drawEx();
        const inputs = $$('[data-k=name]', exList); inputs[inputs.length - 1].focus();
      });
      const files = $('#sFiles', root);
      if (files) files.addEventListener('change', async () => {
        const list = [...files.files]; files.value = '';
        if (!list.length) return;
        uploading = true; $('#sSave', root).disabled = true;
        await uploadFiles(list, (m) => { f.media.push(m); drawMedia(); }, (txt) => { const u = $('#upState', root); if (u) u.textContent = txt; });
        uploading = false; const sv = $('#sSave', root); if (sv) sv.disabled = false;
      });
      $('#sForm', root).addEventListener('submit', async (e) => {
        e.preventDefault();
        if (uploading) return;
        syncEx();
        const sel = $('#sClient', root);
        if (sel) f.clientId = sel.value;
        if (!f.clientId) { toast('Chọn học viên cho buổi tập.'); sel && sel.focus(); return; }
        const data = {
          clientId: f.clientId, date: $('#sDate', root).value || today(), title: $('#sTitle', root).value.trim(),
          exercises: f.exercises.filter((x) => x.name), status: f.status, rating: f.rating, note: $('#sNote', root).value.trim(),
          media: f.media, createdAt: f.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(),
          result: f.result || null, fromTrainee: Boolean(f.fromTrainee),
          sendApp: $('#sSend', root) ? $('#sSend', root).checked : f.sendApp !== false, shareMedia: $('#sShare', root) ? $('#sShare', root).checked : Boolean(f.shareMedia), shared: f.shared || {},
        };
        const fbIn = $('#sFb', root);
        if (fbIn && f.result && fbIn.value.trim() !== ((clientById(data.clientId) || {}).feedback || {})[f.result.wid] && (fbIn.value.trim() || ((clientById(data.clientId) || {}).feedback || {})[f.result.wid])) await setFeedback(data.clientId, f.result.wid, fbIn.value.trim());
        if (await write('sessions', f.id, data)) {
          closeSheet();
          const linked = clientById(data.clientId) && clientById(data.clientId).link;
          toast(isNew ? (linked ? 'Đã lên buổi tập và gửi tới app học viên' : 'Đã lên buổi tập') : 'Đã lưu buổi tập');
          pushSoon(data.clientId);
        }
      });
      const del = $('#sDelete', root);
      if (del) del.addEventListener('click', () => {
        $('#sConfirm', root).innerHTML = `<div class="confirm"><div>Xoá buổi tập ${esc(fmtShort(f.date))}${(sess.media || []).length ? ' cùng ' + sess.media.length + ' ảnh/video' : ''}? Không thể hoàn tác.</div>
          <div class="row"><button class="btn danger solid small" type="button" id="sDelYes">Xoá</button><button class="btn small" type="button" id="sDelNo">Huỷ</button></div></div>`;
        $('#sDelNo', root).onclick = () => { $('#sConfirm', root).innerHTML = ''; };
        $('#sDelYes', root).onclick = async () => {
          if (S.assets) for (const m of sess.media || []) { try { await S.assets.delete(m.id); } catch { /* ignore */ } }
          if (await remove('sessions', f.id)) { closeSheet(); toast('Đã xoá buổi tập'); pushSoon(f.clientId); }
        };
      });
    });
  }

    const sum = (d) => meals.filter((m) => m.date === d).reduce((a, m) => ({ kcal: a.kcal + (m.kcal || 0), protein: a.protein + (m.protein || 0) }), { kcal: 0, protein: 0 });

  async function setFeedback(clientId, refId, text) {
    const c = clientById(clientId); if (!c) return false;

    if (text) feedback[refId] = text.slice(0, 300); else delete feedback[refId];

  // ---------- ảnh/video học viên gửi: tải về máy HLV rồi xoá trên máy chủ ----------
  function b64ToBlob(b64, type) {
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new Blob([u], { type });
  }
  async function fetchTraineeMedia(clientId, list) {
    if (!S.assets || !list.length) return;
    let c = clientById(clientId); if (!c || !c.link) return;
    const map = { ...(c.mediaMap || {}) };
    const started = Date.now();
    let changed = false;
    for (const m of list) {
      if (!m || !m.id || m.id in map || !m.chunks) continue;
      if (Date.now() - started > 60000) break;
      let session = null;
      if (m.ref && m.ref.type === 'workout') {
        session = S.sessions.find((s) => s.clientId === clientId && ((s.result && s.result.wid === m.ref.id) || s.id === 't-' + m.ref.id));
        if (!session) continue; // buổi tập chưa về, lần sau tải
      }
      try {
        const parts = [];
        for (let i = 0; i < m.chunks; i++) parts.push((await api('media-get', { pairId: c.link.pairId, coachKey: coachKey(), id: m.id, idx: i })).data);
        const blob = b64ToBlob(parts.join(''), m.mime || (m.kind === 'video' ? 'video/mp4' : 'image/jpeg'));
        const r = await S.assets.upload(blob, { type: blob.type });
        map[m.id] = r.id; changed = true;
        if (session) {
          const cur = S.sessions.find((s) => s.id === session.id) || session;
          await write('sessions', cur.id, { ...clean(cur), media: [...(cur.media || []), { id: r.id, kind: m.kind, at: m.at || new Date().toISOString(), fromTrainee: true }], updatedAt: new Date().toISOString() });
        }
        api('media-ack', { pairId: c.link.pairId, coachKey: coachKey(), id: m.id, chunks: m.chunks }).catch(() => {});
      } catch (e) {
        if (e.status === 404) { map[m.id] = null; changed = true; } // hết hạn trên máy chủ
        else break;
      }
    }
    c = clientById(clientId);
    if (changed && c) await write('clients', c.id, { ...clean(c), mediaMap: map });
  }

  // ---------- sync with trainee app (Nhật Ký Tập) ----------
  const SYNC_URL = /(^|\.)camgym\.vercel\.app$|^localhost$|^127\.0\.0\.1$/.test(location.hostname) ? '/api/sync' : 'https://camgym.vercel.app/api/sync';
  const DEFAULT_COACH = 'HongCam CamFit';
  function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  const randKey = () => [...crypto.getRandomValues(new Uint8Array(24))].map((b) => b.toString(16).padStart(2, '0')).join('');
  function coachKey() { let k = lsGet('so-hlv.coachKey'); if (!k) { k = randKey(); lsSet('so-hlv.coachKey', k); } return k; }
  const coachName = () => lsGet('so-hlv.coachName') || DEFAULT_COACH;
  async function api(action, body) {
    const r = await fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.message || 'Không kết nối được máy chủ đồng bộ'); e.status = r.status; throw e; }
    return j;
  }
  const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  // ---------- ảnh/video HLV cho học viên xem ----------
  const sharedCache = {};
  function sharedMediaOf(s) {
    if (!s.shareMedia) return [];
    const shared = { ...(s.shared || {}), ...(sharedCache[s.id] || {}) };
    return (s.media || []).filter((m) => !m.fromTrainee && shared[m.id]).map((m) => ({ id: shared[m.id].sid, kind: m.kind, mime: shared[m.id].mime, chunks: shared[m.id].chunks }));
  }
  async function blobOf(id) {
    if (S.mode === 'cloud') { const r = await fetch('/_blob/' + encodeURIComponent(id)); if (!r.ok) throw new Error('blob'); return r.blob(); }
    const rec = await S.assets.get(id); if (!rec) throw new Error('blob'); return rec.blob;
  }
  const toB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
  async function shareSessionMedia(c) {
    const started = Date.now();
    let tooBig = 0, more = false;
    for (const s of sessionsOf(c.id).filter((x) => x.shareMedia && x.sendApp !== false && !x.fromTrainee)) {
      const shared = { ...(s.shared || {}), ...(sharedCache[s.id] || {}) };
      let changed = false;
      for (const m of (s.media || []).filter((x) => !x.fromTrainee && !shared[x.id])) {
        if (Date.now() - started > 90000) { more = true; break; }
        let blob;
        try { blob = await blobOf(m.id); } catch { continue; }
        if (blob.size > 18 * 1024 * 1024) {
          // chỉ nén bản sao để gửi; video gốc trong sổ giữ nguyên
          const r = m.kind === 'video' && canShrinkVideo() ? await shrinkVideo(blob, (p) => toast(`Đang nén video gửi ${c.name}… ${p}%`)) : null;
          if (!r || r.blob.size > 18 * 1024 * 1024) { tooBig++; continue; }
          blob = r.blob;
        }
        const data = await toB64(blob), CH = 500 * 1024, total = Math.max(1, Math.ceil(data.length / CH)), sid = uid('h');
        for (let i = 0; i < total; i++) await api('coach-media-put', { pairId: c.link.pairId, coachKey: coachKey(), id: sid, idx: i, total, data: data.slice(i * CH, (i + 1) * CH) });
        shared[m.id] = { sid, chunks: total, mime: blob.type || (m.kind === 'video' ? 'video/mp4' : 'image/jpeg') };
        changed = true;
      }
      if (changed) {
        sharedCache[s.id] = shared;
        const cur = S.sessions.find((x) => x.id === s.id) || s;
        await write('sessions', s.id, { ...clean(cur), shared });
      }
    }
    if (tooBig) toast(`${tooBig} video quá nặng, chưa nén được để gửi ${c.name}. Hãy cắt ngắn hơn (15–30 giây).`);
    if (more) setTimeout(() => pushPlans(c.id).catch(() => {}), 1500); // còn tệp chưa gửi: gửi tiếp
  }
  function plansFor(clientId) {
    return sessionsOf(clientId).filter((s) => !s.fromTrainee && s.sendApp !== false).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 150)
      .map((s) => ({ id: s.id, no: sessionNo(s), date: s.date, title: s.title || '', note: s.note || '', status: s.status, media: sharedMediaOf(s),
        exercises: (s.exercises || []).map((e) => { const lib = e.libId ? libById(e.libId) : matchLib(e.name);
          return { name: e.name, libId: lib ? lib.id : null, type: lib ? lib.type : (e.type || 'weight'), sets: e.sets ?? null, reps: e.reps ?? null, repsTo: e.repsTo ?? null,
            kg: e.kg ?? null, rest: e.rest ?? null, restText: e.restText || '', note: e.note || '' }; }) }));
  }
  async function pushPlans(clientId) {
    const c = clientById(clientId);
    if (!c || !c.link) return;
    try { await shareSessionMedia(c); } catch (e) { toast('Chưa gửi được ảnh/video cho học viên: ' + (e.message || 'mất mạng?')); }
    await api('coach-push', { pairId: c.link.pairId, coachKey: coachKey(), coachName: coachName(), clientName: c.name, plans: plansFor(clientId),
      tips: tipsPayload(c), feedback: c.feedback || {} });
  }
  const pushSoon = (clientId) => { setTimeout(() => pushPlans(clientId).catch(() => {}), 300); };
  async function pullClient(c) {
    const j = await api('coach-pull', { pairId: c.link.pairId, coachKey: coachKey() });
    S.syncInfo[c.id] = { at: new Date(), error: null };
    const cur = clientById(c.id) || c;
    const p = j.profile;
    const app = p ? { name: p.name || '', height: p.height ?? null, goal: p.goal || '', target: p.target ?? null, weight: p.weight ?? null, bmi: p.bmi ?? null,
      nutri: p.nutri && p.nutri.kcal ? { kcal: Number(p.nutri.kcal) || null, protein: Number(p.nutri.protein) || null } : null, updatedAt: p.updatedAt || p.at || null } : (cur.app || null);
    const link = { ...cur.link, claimed: Boolean(j.claimed), claimedAt: j.claimedAt || null };
    const meals = Array.isArray(j.meals) ? j.meals.slice(0, 200) : (cur.meals || []);
    if (!same(link, cur.link) || !same(app, cur.app) || !same(meals, cur.meals || [])) await write('clients', cur.id, { ...clean(cur), link, app, meals });

    for (const r of j.results || []) {
      if (!r || !r.id) continue;
      const result = { wid: r.id, date: r.date, minutes: r.minutes ?? null, feeling: r.feeling ?? null, note: r.note || '', items: Array.isArray(r.items) ? r.items : [] };
      const plan = r.planId && S.sessions.find((s) => s.id === r.planId && s.clientId === cur.id);
      if (plan) {
        if (plan.status === 'done' && same(plan.result, result)) continue;
        await write('sessions', plan.id, { ...clean(plan), status: 'done', result, exercises: (plan.exercises || []).map((e) => ({ ...e, done: true })), updatedAt: new Date().toISOString() });
      } else {
        const id = 't-' + r.id;
        const ex = S.sessions.find((s) => s.id === id);
        if (ex && same(ex.result, result)) continue;
        await write('sessions', id, {
          clientId: cur.id, date: r.date, title: r.title || 'Học viên tự tập', status: 'done', fromTrainee: true, result,
          rating: ex ? ex.rating : null, note: ex ? ex.note : '', media: ex ? ex.media || [] : [],
          exercises: result.items.map((i) => ({ name: i.name, sets: (i.sets || []).length || null,
            reps: Math.max(0, ...(i.sets || []).map((s) => s.reps || 0)) || null, kg: Math.max(0, ...(i.sets || []).map((s) => s.kg || 0)) || null, done: true })),
          createdAt: ex ? ex.createdAt : new Date().toISOString(), updatedAt: new Date().toISOString(),
        });
      }
    }
    for (const w of (p && p.weights) || []) {
      if (!w || !w.id || !w.weight) continue;
      const id = 'a-' + w.id;
      const m = S.metrics.find((x) => x.id === id);
      if (m && m.weight === w.weight && m.date === w.date) continue;
      await write('metrics', id, { clientId: cur.id, date: w.date, weight: w.weight, waist: m ? m.waist : null, bodyFat: m ? m.bodyFat : null, note: 'Học viên tự ghi trên app' });
    }
    await fetchTraineeMedia(cur.id, Array.isArray(j.media) ? j.media : []);
  }
  let syncingAll = false;
  async function syncAll(manual) {
    if (syncingAll || !S.db) return;
    syncingAll = true;
    let ok = 0, fail = null;
    for (const c of S.clients.filter((x) => x.link)) {
      try { await pushPlans(c.id); await pullClient(c); ok++; }
      catch (e) { fail = e; S.syncInfo[c.id] = { at: S.syncInfo[c.id] ? S.syncInfo[c.id].at : null, error: e.message }; }
    }
    syncingAll = false;
    if (manual) toast(fail ? `Chưa đồng bộ được: ${fail.message}` : `Đã đồng bộ ${ok} học viên`);
    if (S.route.name === 'client') render();
  }
  async function createLink(c, renew) {
    try {
      const now = new Date().toISOString();
      if (c.link && renew) {
        const j = await api('pair-newcode', { pairId: c.link.pairId, coachKey: coachKey() });
        await write('clients', c.id, { ...clean(c), link: { ...c.link, code: j.code, codeAt: now, claimed: false } });
      } else {
        const j = await api('pair-create', { coachKey: coachKey(), clientName: c.name, coachName: coachName() });
        await write('clients', c.id, { ...clean(c), link: { pairId: j.pairId, code: j.code, codeAt: now, claimed: false, claimedAt: null } });
        await pushPlans(c.id);
      }
      toast('Đã tạo mã. Gửi mã này cho học viên.');
    } catch (e) { toast(e.status === 503 ? 'Máy chủ đồng bộ chưa được bật.' : e.message); }
  }
  function linkSection(c) {
    const L = c.link, info = S.syncInfo[c.id], A2 = c.app;
    const nameInput = `<label class="f">Tên HLV hiển thị trên app học viên<input id="coachNameIn" maxlength="60" value="${esc(coachName())}"></label>`;
    if (!L) {
      return `<section><h2>App học viên</h2><div class="card">
        <div class="card-sub">Nối với app <b>Nhật Ký Tập</b> trên điện thoại học viên: bài bạn lên lịch tự hiện bên học viên; buổi học viên tập, cân nặng và hồ sơ tự gửi về đây.</div>
        ${nameInput}
        ${canWrite() ? `<button class="btn primary" data-act="link-create" data-id="${esc(c.id)}">Tạo mã kết nối</button>` : ''}
      </div></section>`;
    }
    const codeOld = L.codeAt && Date.now() - new Date(L.codeAt) > 7 * 86400000;
    return `<section><h2>App học viên</h2><div class="card">
      ${L.claimed ? `<div class="row"><span class="pill done">Đã kết nối</span><span class="card-sub">từ ${esc(new Date(L.claimedAt || L.codeAt).toLocaleDateString('vi-VN'))}${info && info.at ? ' · đồng bộ lúc ' + esc(info.at.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })) : ''}</span></div>`
        : `<div class="card-sub">Gửi mã này cho học viên (Zalo/tin nhắn). Học viên mở <b>camgym.vercel.app</b> → <b>Kết nối với HLV</b> → nhập mã.${codeOld ? ' <b>Mã đã hết hạn</b>, hãy tạo mã mới.' : ' Mã dùng được trong 7 ngày.'}</div>
          <div class="row"><span style="font-family:var(--font-display,inherit);font-size:30px;font-weight:700;letter-spacing:.12em" class="num">${esc(L.code)}</span>
          <button class="btn small" data-act="link-copy" data-code="${esc(L.code)}">Chép mã</button></div>`}
      ${info && info.error ? `<div class="card-sub" style="color:var(--danger)">${esc(info.error)}</div>` : ''}
      ${A2 ? `<div class="card-sub">Học viên ghi: ${esc([A2.height ? `cao ${fmtNum(A2.height)} cm` : '', A2.weight ? `nặng ${fmtNum(A2.weight)} kg` : '', A2.bmi ? `BMI ${fmtNum(A2.bmi)}` : '', A2.goal ? `mục tiêu ${A2.goal}` : '', A2.target ? `cân nặng mục tiêu ${fmtNum(A2.target)} kg` : ''].filter(Boolean).join(' · '))}</div>` : ''}
      ${nameInput}
      <div class="row">
        <button class="btn small primary" data-act="link-sync">${L.claimed ? 'Đồng bộ ngay' : 'Kiểm tra học viên đã nhập mã chưa'}</button>
        ${canWrite() ? `<button class="btn small" data-act="link-create" data-renew="1" data-id="${esc(c.id)}">Tạo mã mới${L.claimed ? ' (học viên đổi máy)' : ''}</button>` : ''}
      </div>
    </div></section>`;
  }
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'coachNameIn') {
      const v = e.target.value.trim() || DEFAULT_COACH; lsSet('so-hlv.coachName', v);
      toast('Đã lưu tên HLV'); S.clients.filter((c) => c.link).forEach((c) => pushSoon(c.id));
    }
  });
  setInterval(() => { if (document.visibilityState === 'visible' && S.db && ready()) syncAll(false); }, 90000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.db && ready()) syncAll(false); });

  // ---------- events ----------
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'nav') { go(el.dataset.to); return; }
    if (act === 'close-sheet') { closeSheet(); return; }
    if (act === 'close-lightbox') { const lb = $('#lightbox'); lb.hidden = true; lb.innerHTML = ''; return; }
    if (act === 'lightbox') { e.preventDefault(); openLightbox(el.dataset.id, el.dataset.kind); return; }
    if (act === 'ctab') { S.clientTab = el.dataset.tab; render(); return; }
    if (act === 'open-session') { const s = S.sessions.find((x) => x.id === el.dataset.id); if (s) sessionSheet(s); return; }
    if (act === 'export') { exportBackup(); return; }
    if (act === 'tip-edit') { tipSheet(el.dataset.id); return; }
    if (act === 'ptip-add') {
      const c = clientById(el.dataset.client); const text = ($('#ptText') || {}).value; if (!c || !text || !text.trim()) { toast('Nhập nội dung mẹo.'); return; }
      const tips = [...(c.tips || []), { id: uid('p'), exId: $('#ptEx').value || '', text: text.trim().slice(0, 200) }].slice(-100);
      if (await write('clients', c.id, { ...clean(c), tips })) { toast(c.link ? 'Đã thêm mẹo, đang gửi học viên' : 'Đã thêm mẹo'); pushSoon(c.id); }
      return;
    }
    if (act === 'ptip-del') {
      const c = clientById(el.dataset.client); if (!c) return;
      if (await write('clients', c.id, { ...clean(c), tips: (c.tips || []).filter((p) => p.id !== el.dataset.id) })) pushSoon(c.id);
      return;
    }
    if (act === 'meal-fb') {
      const inp = document.getElementById('fb-' + el.dataset.id); const text = inp ? inp.value.trim() : '';
      if (!text) { toast('Nhập nhận xét trước khi gửi.'); return; }
      el.disabled = true; if (await setFeedback(el.dataset.client, el.dataset.id, text)) toast('Đã gửi nhận xét cho học viên'); el.disabled = false;
      return;
    }
    if (!canWrite()) return;
    if (act === 'new-client') clientSheet(null);
    else if (act === 'edit-client') clientSheet(clientById(el.dataset.id));
    else if (act === 'new-session') sessionSheet(newSessionFor(el.dataset.client || '', false));
    else if (act === 'repeat') sessionSheet(newSessionFor(el.dataset.client, true));
    else if (act === 'new-metric') metricSheet(el.dataset.client, null);
    else if (act === 'edit-metric') { const m = S.metrics.find((x) => x.id === el.dataset.id); if (m) metricSheet(m.clientId, m); }
    else if (act === 'quick-done') {
      const s = S.sessions.find((x) => x.id === el.dataset.id); if (!s) return;
      el.disabled = true;
      const data = { ...clean(s), status: 'done', exercises: (s.exercises || []).map((x) => ({ ...x, done: true })), updatedAt: new Date().toISOString() };
      if (await write('sessions', s.id, data)) { toast('Đã đánh dấu đã tập'); pushSoon(s.clientId); } else el.disabled = false;
    }
    else if (act === 'link-create') { const c = clientById(el.dataset.id); if (c) { el.disabled = true; await createLink(c, el.dataset.renew === '1'); el.disabled = false; } }
    else if (act === 'link-sync') { el.disabled = true; await syncAll(true); el.disabled = false; render(); }
    else if (act === 'link-copy') {
      const code = el.dataset.code;
      try { await navigator.clipboard.writeText(code); toast('Đã chép mã ' + code); }
      catch { toast('Không chép tự động được. Mã: ' + code); }
    }
  });
  $('#backBtn').addEventListener('click', () => { if (history.length > 1 && document.referrer !== undefined && location.hash) history.back(); else go('clients'); });
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'importFile' && e.target.files[0]) {
      const f = e.target.files[0]; e.target.value = '';
      importBackup(f);
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#lightbox').hidden) { $('#lightbox').hidden = true; $('#lightbox').innerHTML = ''; }
    else if (!$('#sheet').hidden) closeSheet();
  });

  // ---------- boot ----------
  async function boot() {
    S.route = parseHash();
    render();
    const onClaude = window.claude && typeof window.claude.use === 'function';
    const cloudDb = onClaude ? await window.claude.use('db') : null;
    let db = cloudDb;
    if (!db) {
      // Standalone build (e.g. Vercel) or db not served: keep everything on this phone.
      if (!('indexedDB' in window)) {
        S.unavailable = 'Trình duyệt này không lưu được dữ liệu. Hãy mở bằng Safari hoặc Chrome (không ở chế độ ẩn danh).';
        render(); return;
      }
      const local = localBackend();
      S.mode = 'local'; db = local.db; S.assets = local.assets;
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    }
    S.db = db;
    if (S.mode === 'cloud') window.claude.use('assets').then((a) => { S.assets = a; render(); }, () => {});
    if (S.mode === 'cloud')
    window.claude.use('user').then(async (u) => {
      if (!u) return;
      const can = await u.can('data.write');
      if (can === false) { S.readOnly = true; render(); }
    }, () => {});

    const slowTimer = setTimeout(() => { S.slow = true; render(); }, 10000);
    for (const col of ['clients', 'sessions', 'metrics']) {
      db.collection(col).onSnapshot((snap) => {
        S[col] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        S.got[col] = true;
        if (ready() && !snap.metadata.fromCache) { clearTimeout(slowTimer); S.slow = false; }
        if (ready() && !S.syncedOnce) { S.syncedOnce = true; setTimeout(() => syncAll(false), 400); }
        render();
      }, (err) => {
        clearTimeout(slowTimer);
        S.error = err && err.code; S.got[col] = true; render();
      });
    }
  }
  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
</body>
</html>
